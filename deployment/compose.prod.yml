# Production overlay for compose.yml. Usage (explicit -f also stops compose.override.yml from auto-loading):
#   docker compose --env-file deployment/.env -f compose.yml -f deployment/compose.prod.yml up -d --build
# Build the SPA first (docs/deployment.md §5) so src/UnshackledWord.Web/dist exists.
services:
  unshackledword.tooling.database:
    container_name: unshackledword-db
    restart: unless-stopped
    ports: !reset []                 # no host port; only the compose network reaches Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  unshackledword.tooling.db-migration:
    restart: "no"
    depends_on:
      unshackledword.tooling.database:
        condition: service_healthy

  unshackledword.tooling.seed-db:
    restart: "no"
    depends_on:
      unshackledword.tooling.database:
        condition: service_healthy
      unshackledword.tooling.db-migration:
        condition: service_completed_successfully

  unshackledword.tooling.webapi:
    restart: unless-stopped
    ports: !reset []                 # the proxy reaches it as unshackledword.tooling.webapi:8080
    depends_on:
      unshackledword.tooling.database:
        condition: service_healthy
      unshackledword.tooling.db-migration:
        condition: service_completed_successfully
      unshackledword.tooling.seed-db:
        condition: service_completed_successfully
      mailpit: !reset null
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Required: the base compose.yml falls back to http://localhost:5173, which put localhost links into the emails.
      # Compose refuses to start the API while FRONTEND_BASE_URL is unset in .env.
      - UNSHACKLEDWORD_APP__FRONTENDBASEURL=${FRONTEND_BASE_URL:?set FRONTEND_BASE_URL in .env to the public https origin}
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true   # trust X-Forwarded-Proto/-For from the proxies
      - UNSHACKLEDWORD_REVERSEPROXY__FORWARDLIMIT=2  # two hops: NPM -> unshackledword-web (nginx) -> API
    volumes:
      - dataprotection:/home/app/.aspnet           # cookie encryption keys: keeps sessions valid across deploys

  mailpit:
    profiles: ["dev"]                # never started in production
    ports: !reset []

  unshackledword.tooling.mcpserver:
    profiles: ["mcp"]                # opt in with `--profile mcp`; it has no authentication, keep it off the internet
    restart: unless-stopped
    ports: !reset []

  unshackledword.web:
    profiles: ["dev"]                # the Vite dev image is not for production

  # Static SPA + /api forwarding. TLS is terminated by Nginx Proxy Manager, which forwards to the published port below.
  unshackledword.web-prod:
    image: nginx:alpine
    container_name: unshackledword-web
    restart: unless-stopped
    depends_on:
      - unshackledword.tooling.webapi
    # Monitoring layer (compose.monitoring.yml, docs/deployment.md §9): nothing to add. Its services (unshackledword.monitoring,
    # uptime-kuma, umami) share the default compose network, and nginx.prod.conf resolves them at request time.
    volumes:
      - ./deployment/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/UnshackledWord.Web/dist:/usr/share/nginx/html:ro
      - ./fonts:/srv/fonts:ro                      # optional: SBL fonts in ./fonts/sbl (not distributed, see fonts/README.md)
    ports:
      - "${WEB_BIND:-192.168.30.22:8081}:80"   # NPM (another host) forwards to this address; not for the public internet

volumes:
  dataprotection:
