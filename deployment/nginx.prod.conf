# Mounted by deployment/compose.prod.yml. TLS is handled by Nginx Proxy Manager in front.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://unshackledword.tooling.webapi:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep the scheme NPM saw (https); $scheme here would be http.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 50m;
        proxy_read_timeout 300s;
    }

    # Optional SBL fonts (bind-mounted at /srv/fonts, not in the repo). Must 404 when absent, not fall back to index.html.
    location /fonts/ {
        root /srv;
        try_files $uri =404;
        expires 1d;
    }

    location / {
        try_files $uri /index.html;   # SPA fallback for client-side routes
    }
}
