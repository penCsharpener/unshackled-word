# Mounted by deployment/compose.prod.yml. TLS is handled by Nginx Proxy Manager in front.
# --- Monitoring layer (docs/deployment.md §9; only used when compose.monitoring.yml is up) ---------------------
# NPM forwards every hostname to this one nginx and keeps the Host header, so the subdomains are separate server blocks.
# Replace example.org with your domain and add the three subdomains as NPM proxy hosts (same target, same certificate setup).
# Upstreams are resolved at request time (variable + resolver) so nginx still starts when the monitoring layer is not running.
resolver 127.0.0.11 valid=10s;

map $http_upgrade $connection_upgrade {   # Uptime Kuma needs websockets
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name monitor.example.org;     # Grafana (login required, anonymous access off)
    location / {
        set $grafana http://unshackledword.monitoring:3000;
        proxy_pass $grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;             # Grafana Live
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    server_name status.example.org;      # Uptime Kuma (own login)
    location / {
        set $kuma http://uptime-kuma:3001;
        proxy_pass $kuma;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    server_name analytics.example.org;   # Umami UI (own login)
    location / {
        set $umami http://umami:3000;
        proxy_pass $umami;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

server {
    listen 80 default_server;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://unshackledword.tooling.webapi:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep the scheme NPM saw (https); $scheme here would be http.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 50m;
        proxy_read_timeout 300s;
    }

    # Garage media reads (presigned GET, vocab audio). Upstream resolved at request time so nginx starts without Garage.
    # The public Host header must reach Garage unchanged ($http_host incl. port): SigV4 signs it. The /media prefix is stripped.
    location /media/ {
        set $garage http://unshackledword.garage:3900;
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass $garage;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # Optional SBL fonts (bind-mounted at /srv/fonts, not in the repo). Must 404 when absent, not fall back to index.html.
    location /fonts/ {
        root /srv;
        try_files $uri =404;
        expires 1d;
    }

    # Umami tracker, same origin (no third-party request, no cookie banner). Only these two paths are public;
    # the /stats prefix is stripped (/stats/script.js -> /script.js, /stats/api/send -> /api/send).
    location ~ ^/stats/(script\.js|api/send)$ {
        set $umami http://umami:3000;
        rewrite ^/stats/(.*)$ /$1 break;
        proxy_pass $umami;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri /index.html;   # SPA fallback for client-side routes
    }
}
