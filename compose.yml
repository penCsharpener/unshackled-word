services:
  unshackledword.tooling.database:
    image: postgres:18
    container_name: postgres-test-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test}
    ports:
      - "5432:5432"
    volumes:
      - unshackled_postgres:/var/lib/postgresql

  unshackledword.tooling.db-migration:
    #image: unshackledword.migration.postgres
    depends_on:
      - unshackledword.tooling.database
    build:
      context: .
      dockerfile: src/UnshackledWord.Tooling.Postgres.Migration/Dockerfile
    environment:
      - UNSHACKLEDWORD_ENVIRONMENT=${ENVIRONMENT}
      - UNSHACKLEDWORD_CONNECTIONSTRINGS__POSTGRESCONNECTION=${POSTGRES_CONNECTIONSTRING}

  unshackledword.tooling.seed-db:
    #image: unshackledword.tooling.seeddb
    depends_on:
      - unshackledword.tooling.database
      - unshackledword.tooling.db-migration
    build:
      context: .
      dockerfile: src/UnshackledWord.Tooling.SeedDb/Dockerfile
    user: "1000:1000"
    environment:
      - UNSHACKLEDWORD_ENVIRONMENT=${ENVIRONMENT}
      - UNSHACKLEDWORD_CONNECTIONSTRINGS__POSTGRESCONNECTION=${POSTGRES_CONNECTIONSTRING}
      - UNSHACKLEDWORD_APPSETTINGS__DATABASESEEDING__SOLUTIONTEMPPATH=${SOLUTIONTEMPPATH:-/src/temp}
      - UNSHACKLEDWORD_APPSETTINGS__DATABASESEEDING__SOLUTIONASSETSPATH=${SOLUTIONASSETSPATH:-/src/assets}
    volumes:
      - ./assets:/src/assets
      - ./temp:/src/temp
# docker run -it --entrypoint /bin/bash unshackledword.tooling.seed-db

  unshackledword.tooling.webapi:
    #image: unshackledword.tooling.webapi
    depends_on:
      - unshackledword.tooling.database
      - unshackledword.tooling.seed-db
      - unshackledword.tooling.db-migration
      - mailpit
    build:
      context: .
      dockerfile: src/UnshackledWord.Tooling.WebApi/Dockerfile
    ports:
      - "7654:8080"
    environment:
      - UNSHACKLEDWORD_ENVIRONMENT=${ENVIRONMENT}
      - UNSHACKLEDWORD_CONNECTIONSTRINGS__POSTGRESCONNECTION=${POSTGRES_CONNECTIONSTRING}
      - UNSHACKLEDWORD_MAPPINGEDITING__ENABLED=${MAPPING_EDITING_ENABLED:-false}
      # Accounts: links in emails and the passkey origin derive from the frontend URL.
      - UNSHACKLEDWORD_APP__FRONTENDBASEURL=${FRONTEND_BASE_URL:-http://localhost:5173}
      - UNSHACKLEDWORD_APP__REQUIRESECURECOOKIES=${REQUIRE_SECURE_COOKIES:-true}
      - UNSHACKLEDWORD_REGISTRATION__MODE=${REGISTRATION_MODE:-Open}
      # Email goes to the mailpit sandbox by default; override Security/Username/Password for a real provider.
      - UNSHACKLEDWORD_EMAIL__SMTPHOST=${EMAIL_SMTP_HOST:-mailpit}
      - UNSHACKLEDWORD_EMAIL__SMTPPORT=${EMAIL_SMTP_PORT:-1025}
      - UNSHACKLEDWORD_EMAIL__SECURITY=${EMAIL_SECURITY:-None}
      - UNSHACKLEDWORD_EMAIL__USERNAME=${EMAIL_USERNAME:-}
      - UNSHACKLEDWORD_EMAIL__PASSWORD=${EMAIL_PASSWORD:-}
      - UNSHACKLEDWORD_EMAIL__FROMADDRESS=${EMAIL_FROM_ADDRESS:-noreply@unshackled-word.local}

  # Local SMTP sandbox with a catch-all web inbox (http://localhost:8025); nothing ever leaves the machine.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI

  unshackledword.tooling.mcpserver:
    #image: unshackledword.tooling.mcpserver
    depends_on:
      - unshackledword.tooling.database
      - unshackledword.tooling.db-migration
    build:
      context: .
      dockerfile: src/UnshackledWord.Tooling.McpServer/Dockerfile
    ports:
      - "7655:8080"
    environment:
      - UNSHACKLEDWORD_ENVIRONMENT=${ENVIRONMENT}
      - UNSHACKLEDWORD_CONNECTIONSTRINGS__POSTGRESCONNECTION=${POSTGRES_CONNECTIONSTRING}
      - UNSHACKLEDWORD_SERILOG__MINIMUMLEVEL__DEFAULT=${MCP_LOG_LEVEL:-Information}

  unshackledword.web:
    build:
      context: src/UnshackledWord.Web
    ports:
      - "5173:5173"
    environment:
      # Browsers call the same-origin /api; the Vite dev server proxies it to the API on the host.
      - VITE_WORD_DETAIL_SOURCE=api
      - API_PROXY_TARGET=${API_PROXY_TARGET:-http://host.docker.internal:5142}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src/UnshackledWord.Web:/app
      - unshackled_web_node_modules:/app/node_modules
      - ./Components.md:/Components.md:ro

volumes:
  unshackled_postgres:
  unshackled_web_node_modules:
