<!--
  Click dummy for roadmap 0012 (header menu with chapter picker, reading column, margin panels).

  The dark bar at the top is the dummy's control bar and NOT part of the design.

<style>
  /* ---------- Dummy chrome (not part of the design; raw colours are intentional here) ---------- */
  html, body { margin: 0; height: 100%; }
  body.outer {
    background: repeating-conic-gradient(#2a2b30 0% 25%, #24252a 0% 50%) 0 0 / 24px 24px;
    font: 13px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #e8e8ec;
    overflow: hidden;
  }
  #ctl {
    position: fixed; top: 6px; left: 6px; right: 6px; z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
    padding: 6px 10px;
    background: #111216ee; border: 2px dashed #ff4fd8; border-radius: 10px;
    box-shadow: 0 4px 16px #0008;
  }
  #ctl.collapsed { left: auto; }
  #ctl.collapsed .grp { display: none; }
  .tag { color: #ff4fd8; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
  .grp { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .grp > span { color: #a0a0aa; margin-right: 2px; }
  #ctl button {
    font: inherit; color: #e8e8ec; background: #2b2d35; border: 1px solid #44464f;
    border-radius: 6px; padding: 3px 8px; cursor: pointer;
  }
  #ctl button:hover { background: #3a3d48; }
  #ctl button[aria-pressed="true"] { background: #ff4fd8; border-color: #ff4fd8; color: #111; font-weight: 700; }
  #ctl label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  #readout { color: #9fe; white-space: nowrap; }
  #stage { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: flex-start; }
  #frame-box { position: relative; overflow: hidden; box-shadow: 0 0 0 1px #ff4fd855, 0 8px 40px #000a; }
  #app { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #fff; }
</style>

<body class="outer">

               background: var(--uw-surface); border: 1px solid var(--uw-border); box-shadow: var(--uw-shadow); }

  .tab:hover { background: var(--uw-border); }

  main { max-width: 120rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  .hi-slot { display: flex; align-items: flex-end; pointer-events: none; }
  .hi-slot:empty { display: none; }

  .wd-hover { pointer-events: none; }
  @media (min-width: 64rem) {

</style>

    if (pinned === id) { unpin(false); return; }
    const r = w.getBoundingClientRect();
    pin(id, e.detail === 0 ? r.left + r.width / 2 : e.clientX); // detail 0 = keyboard (Enter/Space)
  });
  document.addEventListener("click", (e) => {
    const act = e.target.closest("[data-act]");
    if (act?.dataset.act === "all") { toast(t("toastAll")(words[pinned].text)); return; }
    if (act?.dataset.act === "close") { unpin(true); return; }
    if (pinned !== null && !e.target.closest(".card, .w")) unpin(false);
  });

  // ---------- Picker ----------
  const picker = $("#picker"), slot = $("#picker-slot"), row = $("#picker-row"), panel = $("#panel");
  let open = null;
  function mountPicker() { (mqOneRow.matches ? slot : row).appendChild(picker); }
  function setOpen(tst, focusTab) {
    const prev = open; open = tst;
    for (const b of picker.querySelectorAll(".tab")) b.setAttribute("aria-expanded", String(b.dataset.t === open));
    panel.hidden = !open;
    if (open) renderPanel();
    if (!open && focusTab && prev) $(`#tab-${prev}`).focus();
  }
  function renderPanel() {
    const list = BOOKS[open];
    panel.setAttribute("aria-label", t(open));
    panel.innerHTML = `<div class="panel-head"><h2>${t(open)} · ${t("books")(list.length)}</h2>
      <button type="button" class="btn btn-ghost btn-sm" data-pclose aria-label="${t("close")}">×</button></div>
      <div class="books">${pickerGroups(open).map(({ i, from, to, title }) => {
        const cols = Math.min(6, Math.max(1, Math.ceil((to - from + 1) / 10)));
        const isCurGroup = cur.t === open && cur.b === i && cur.c >= from && cur.c <= to;
        const chs = Array.from({ length: to - from + 1 }, (_, k) => from + k).map((c) =>
          `<a href="#" class="ch" data-b="${i}" data-c="${c}" ${isCurGroup && c === cur.c ? 'aria-current="page"' : ""} aria-label="${bookName(open, i)} ${c}">${c}</a>`).join("");
        return `<div class="book${isCurGroup ? " open" : ""}" data-cols="${cols}"><h3>
          <button type="button" class="btn btn-ghost btn-sm btoggle" aria-expanded="${isCurGroup}">${title}</button>
          <span class="bname">${title}</span></h3><div class="chs">${chs}</div></div>`;
      }).join("")}</div>`;
  }
  // Psalms are split into their five books (PSALM_SECTIONS in lib/bible/books.ts), like the real picker.
  const PSALM_SECTIONS = [[1, 41], [42, 72], [73, 89], [90, 106], [107, 150]];
  const PSALMS_INDEX = 18;
  function pickerGroups(tst) {
    return BOOKS[tst].flatMap((b, i) => {
      const name = bookName(tst, i);
      if (tst === "ot" && i === PSALMS_INDEX) {
        return PSALM_SECTIONS.map(([from, to], k) => ({ i, from, to, title: t("psalmsSection")(name, k + 1, from, to) }));
      }
      return [{ i, from: 1, to: b[2], title: name }];
    });
  }
  picker.addEventListener("click", (e) => {
    const tab = e.target.closest(".tab"); if (!tab) return;
    setOpen(open === tab.dataset.t ? null : tab.dataset.t, false);
  });
  panel.addEventListener("click", (e) => {
    if (e.target.closest("[data-pclose]")) { setOpen(null, true); return; }
    const tg = e.target.closest(".btoggle");
    if (tg) { const bk = tg.closest(".book"); bk.classList.toggle("open"); tg.setAttribute("aria-expanded", bk.classList.contains("open")); return; }
    const ch = e.target.closest(".ch"); if (!ch) return;
    e.preventDefault();
    goTo({ t: open, b: +ch.dataset.b, c: +ch.dataset.c });
    setOpen(null, false);
  });
  // Outside click closes the panel and is swallowed (it does not also pin a word).
  document.addEventListener("click", (e) => {
    if (!open) return;
    if (e.target.closest(".panel, .tab")) return;
    setOpen(null, false); e.stopPropagation(); e.preventDefault();
  }, true);

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (open) { setOpen(null, true); return; }
    if ($("#user-menu")) { closeUserMenu(); return; }
    if (pinned !== null) unpin(true);
  });

  // ---------- Chapter navigation ----------
  function goTo(r) {
    cur = r; pinned = null; hover = null;
    renderChapterNav(); render();
    scrollTo({ top: 0 });
    toast(t("toastNav")(ref(r)));
  }
  function renderChapterNav() {
    $("#title").textContent = ref(cur);
    document.title = `${ref(cur)} – Unshackled Word`;
    const p = step(-1), n = step(1);
    $("#prev").disabled = !p; $("#next").disabled = !n;
    $("#prev").setAttribute("aria-label", p ? `${t("prev")}: ${ref(p)}` : t("prev"));
    $("#next").setAttribute("aria-label", n ? `${t("next")}: ${ref(n)}` : t("next"));
  }
  $("#prev").addEventListener("click", () => { const p = step(-1); if (p) goTo(p); });
  $("#next").addEventListener("click", () => { const n = step(1); if (n) goTo(n); });

  // ---------- Slider ----------
  const slider = $("#slider");
  function syncSlider() {
    const name = t("levels")[+slider.value];
    slider.setAttribute("aria-label", t("levelSlider")); slider.setAttribute("aria-valuetext", name); slider.title = name;
  }
  slider.addEventListener("input", () => { syncSlider(); toast(t("toastLevel")(t("levels")[+slider.value])); });

  // ---------- Header tools ----------
  let loggedIn = true;
  const user = $("#user");
  function renderUser() {
    $(".nav-edit").classList.toggle("on", loggedIn);
    user.innerHTML = loggedIn
      ? `<button type="button" class="btn btn-ghost btn-sm" id="user-btn" aria-haspopup="menu" aria-expanded="false" aria-label="${t("signedIn")}"><span class="avatar" aria-hidden="true">M</span></button>`
      : `<button type="button" class="btn btn-secondary btn-sm" id="login-btn">${t("login")}</button>`;
  }
  function closeUserMenu() { $("#user-menu")?.remove(); $("#user-btn")?.setAttribute("aria-expanded", "false"); }
  user.addEventListener("click", (e) => {
    if (e.target.closest("#login-btn")) { setAuth(true, true); return; }
    if (e.target.closest("[data-logout]")) { closeUserMenu(); setAuth(false, true); return; }
    if (e.target.closest("[data-profile]")) { closeUserMenu(); toast(t("toastDummy")); return; }
    if (e.target.closest("#user-btn")) {
      if ($("#user-menu")) { closeUserMenu(); return; }
      user.insertAdjacentHTML("beforeend", `<div class="user-menu" id="user-menu" role="menu"><p>${t("signedIn")}</p>
        <button type="button" class="btn btn-ghost btn-sm" role="menuitem" data-profile>${t("profile")}</button>
        <button type="button" class="btn btn-ghost btn-sm" role="menuitem" data-logout>${t("logout")}</button></div>`);
      $("#user-btn").setAttribute("aria-expanded", "true");
    }
  });
  document.addEventListener("click", (e) => { if (!e.target.closest("#user")) closeUserMenu(); });
  $("#search").addEventListener("click", () => toast(t("toastDummy")));
  document.querySelectorAll("[data-dummy]").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); toast(t("toastDummy")); }));

  const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  const MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>';
  function setTheme(v, notify) {
    document.documentElement.dataset.theme = v;
    $("#theme-icon").innerHTML = v === "dark" ? SUN : MOON;
    if (notify) parent.postMessage({ type: "theme", value: v }, "*");
  }
  $("#theme").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true));
  function setAuth(v, notify) { loggedIn = v; renderUser(); if (notify) parent.postMessage({ type: "auth", value: v }, "*"); }
  function setLang(v, notify) {
    lang = v; document.documentElement.lang = v;
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-label]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nLabel)); el.title = t(el.dataset.i18nLabel); });
    document.querySelectorAll("[data-setlang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.setlang === v)));
    renderUser(); renderChapterNav(); syncSlider(); render();
    if (open) renderPanel();
    if (notify) parent.postMessage({ type: "lang", value: v }, "*");
  }
  document.querySelectorAll("[data-setlang]").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.setlang, true)));

  let toastTimer;
  function toast(msg) {
    const el = $("#toast"); el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3000);
  }

  window.addEventListener("message", (e) => {
    const d = e.data || {};
    if (d.type === "theme") setTheme(d.value, false);
    if (d.type === "auth") setAuth(d.value, false);
    if (d.type === "lang") setLang(d.value, false);
    if (d.type === "layout") { mountPicker(); render(); } // width preset changed (resize events can lag in a hidden tab)
  });
  for (const mq of [mqMd, mqLg, mqOneRow, mqFhd]) mq.addEventListener("change", () => { mountPicker(); render(); });
  addEventListener("resize", () => { mountPicker(); if (mode() === "sm") placePopover(); else render(); });

  mountPicker(); setTheme("light", false); setLang("de", false);
  parent.postMessage({ type: "ready" }, "*");
})();
</script>
</template>

<script>
  // ---------- Dummy control logic ----------
  const WIDTHS = [390, 768, 1024, 1199, 1200, 1366, 1920, 2560, 3840];
  const ctl = document.getElementById("ctl"), stage = document.getElementById("stage");
  const box = document.getElementById("frame-box"), frame = document.getElementById("app");
  const readout = document.getElementById("readout");
  let width = 1920, theme = "light", lang = "de";

  const wg = document.getElementById("widths");
  for (const w of [...WIDTHS, "fit"]) {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.w = w; b.textContent = w === "fit" ? "Fenster" : w;
    b.addEventListener("click", () => { width = w; layout(); });
    wg.appendChild(b);
  }
  function modeLabel(w) {
    if (w < 768) return "mobil: Info-Zeile im Header, Picker-Zeile, Popover als Sheet";
    if (w < 1024) return "Tablet: Info im Header, Picker-Zeile, Popover";
    if (w < 1200) return "Laptop: Picker-Zeile unter dem Header, Text links, HI + WD im rechten Rand auf Vershöhe";
    if (w < 1920) return "Laptop: eine Kopfzeile mit Picker, Text links, HI + WD im rechten Rand auf Vershöhe";
    return "FHD+: eine Kopfzeile, Text mittig, HI + WD im Rand auf der Zeigerseite";
  }
  function layout() {
    const top = ctl.offsetHeight + 12;
    stage.style.top = `${top}px`;
    const availW = stage.clientWidth - 24, availH = stage.clientHeight - 12;
    const w = width === "fit" ? Math.max(320, Math.floor(availW)) : width;
    const s = Math.min(1, availW / w);
    frame.style.width = `${w}px`;
    frame.style.height = `${Math.floor(availH / s)}px`;
    frame.style.transform = `scale(${s})`;
    box.style.width = `${Math.floor(w * s)}px`;
    box.style.height = `${Math.floor(availH)}px`;
    for (const b of wg.querySelectorAll("button")) b.setAttribute("aria-pressed", String(String(width) === b.dataset.w));
    send({ type: "layout" });
    readout.textContent = `${w} px · ${Math.round(s * 100)} % · ${modeLabel(w)}`;
  }
  function send(msg) { frame.contentWindow?.postMessage(msg, "*"); }
  function pressed(attr, v) { for (const b of ctl.querySelectorAll(`[data-${attr}]`)) b.setAttribute("aria-pressed", String(b.dataset[attr] === v)); }
  ctl.querySelectorAll("[data-theme]").forEach((b) => b.addEventListener("click", () => { theme = b.dataset.theme; pressed("theme", theme); send({ type: "theme", value: theme }); }));
  ctl.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => { lang = b.dataset.lang; pressed("lang", lang); send({ type: "lang", value: lang }); }));
  document.getElementById("auth").addEventListener("change", (e) => send({ type: "auth", value: e.target.checked }));
  document.getElementById("collapse").addEventListener("click", (e) => {
    const c = ctl.classList.toggle("collapsed"); e.target.textContent = c ? "+" : "–"; layout();
  });
  addEventListener("message", (e) => {
    const d = e.data || {};
    if (d.type === "theme") { theme = d.value; pressed("theme", theme); }
    if (d.type === "lang") { lang = d.value; pressed("lang", lang); }
    if (d.type === "auth") document.getElementById("auth").checked = d.value;
    if (d.type === "ready") { send({ type: "theme", value: theme }); send({ type: "lang", value: lang }); }
  });
  addEventListener("resize", layout);

  const src = document.getElementById("app-src").innerHTML;
  frame.srcdoc = `<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>1. Mose 1 – Unshackled Word</title></head><body>${src}</body></html>`;
  pressed("theme", theme); pressed("lang", lang);
  layout();
</script>
</body>
</html>
