<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strong Statistik Mockup</title>
<style>
/* ------------------------------------------------------------------
   Design tokens, copied from src/UnshackledWord.Web/src/styles/index.css.
   NEW tokens proposed by this draft are marked "NEW".
   ------------------------------------------------------------------ */
:root {
  color-scheme: light;
  --spacing: 0.25rem;
  --radius-sm: 0.25rem; --radius-md: 0.375rem; --radius-lg: 0.5rem;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem; --text-lg: 1.125rem;
  --text-xl: 1.25rem; --text-2xl: 1.5rem; --text-3xl: 1.875rem; --text-4xl: 2.25rem;
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-scripture: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-original: "SBL BibLit", "Noto Serif Hebrew", "Noto Serif", "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
  --container-page: 72rem;
  --container-page-wide: 120rem;

  --uw-bg: oklch(0.99 0.004 85);
  --uw-surface: oklch(1 0 0);
  --uw-surface-muted: oklch(0.96 0.006 85);
  --uw-fg: oklch(0.22 0.01 60);
  --uw-fg-muted: oklch(0.48 0.01 60);
  --uw-border: oklch(0.88 0.008 80);
  --uw-accent: oklch(0.42 0.1 30);
  --uw-accent-fg: oklch(0.99 0.004 85);
  --uw-focus: oklch(0.6 0.15 250);
  --uw-mark-same: oklch(0.88 0.08 240);
  --uw-mark-related: oklch(0.9 0.1 150);
  --uw-mark-linked: oklch(0.9 0.14 95);

  /* NEW: categorical chart slots (validated: dataviz palette, light surface; CVD/normal-vision pass,
     slots 3/4/5 below 3:1 contrast -> every bar/slice carries a visible number + list/table). */
  --uw-chart-1: #2a78d6; --uw-chart-2: #eb6834; --uw-chart-3: #1baf7a; --uw-chart-4: #eda100;
  --uw-chart-5: #e87ba4; --uw-chart-6: #008300; --uw-chart-7: #6250d6; --uw-chart-8: #e34948;
  /* NEW: zero-bar / empty donut track */
  --uw-chart-empty: oklch(0.9 0.006 80);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --uw-bg: oklch(0.18 0.008 60);
  --uw-surface: oklch(0.22 0.01 60);
  --uw-surface-muted: oklch(0.27 0.012 60);
  --uw-fg: oklch(0.94 0.005 85);
  --uw-fg-muted: oklch(0.7 0.01 70);
  --uw-border: oklch(0.34 0.012 60);
  --uw-accent: oklch(0.78 0.1 50);
  --uw-accent-fg: oklch(0.2 0.01 60);
  --uw-focus: oklch(0.72 0.14 250);
  --uw-mark-same: oklch(0.42 0.09 240);
  --uw-mark-related: oklch(0.42 0.09 150);
  --uw-mark-linked: oklch(0.5 0.1 90);
  --uw-chart-1: #3987e5; --uw-chart-2: #d95926; --uw-chart-3: #199e70; --uw-chart-4: #c98500;
  --uw-chart-5: #d55181; --uw-chart-6: #008300; --uw-chart-7: #9085e9; --uw-chart-8: #e66767;
  --uw-chart-empty: oklch(0.3 0.01 60);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --uw-bg: oklch(0.18 0.008 60);
    --uw-surface: oklch(0.22 0.01 60);
    --uw-surface-muted: oklch(0.27 0.012 60);
    --uw-fg: oklch(0.94 0.005 85);
    --uw-fg-muted: oklch(0.7 0.01 70);
    --uw-border: oklch(0.34 0.012 60);
    --uw-accent: oklch(0.78 0.1 50);
    --uw-accent-fg: oklch(0.2 0.01 60);
    --uw-focus: oklch(0.72 0.14 250);
    --uw-mark-same: oklch(0.42 0.09 240);
    --uw-chart-1: #3987e5; --uw-chart-2: #d95926; --uw-chart-3: #199e70; --uw-chart-4: #c98500;
    --uw-chart-5: #d55181; --uw-chart-6: #008300; --uw-chart-7: #9085e9; --uw-chart-8: #e66767;
    --uw-chart-empty: oklch(0.3 0.01 60);
  }
}

/* Bible sections -> chart slots (NEW, lives in lib/bible/books.ts as a static table) */
[data-section="law"]{--c:var(--uw-chart-1)} [data-section="history"]{--c:var(--uw-chart-2)}
[data-section="wisdom"]{--c:var(--uw-chart-3)} [data-section="prophets"]{--c:var(--uw-chart-4)}
[data-section="gospels"]{--c:var(--uw-chart-5)} [data-section="paul"]{--c:var(--uw-chart-6)}
[data-section="general"]{--c:var(--uw-chart-7)} [data-section="revelation"]{--c:var(--uw-chart-8)}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--uw-bg); color: var(--uw-fg); font-family: var(--font-sans); line-height: 1.5; }
:focus-visible { outline: 2px solid var(--uw-focus); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.muted { color: var(--uw-fg-muted); }

/* ---- mockup-only toolbar ---- */
.mock-bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: calc(var(--spacing)*2); align-items: center;
  padding: calc(var(--spacing)*2) calc(var(--spacing)*4); background: var(--uw-surface-muted); border-bottom: 1px solid var(--uw-border); font-size: var(--text-sm); }
.mock-bar strong { margin-right: calc(var(--spacing)*2); }
.btn { font: inherit; font-size: var(--text-sm); cursor: pointer; border: 1px solid var(--uw-border); background: var(--uw-surface); color: var(--uw-fg);
  border-radius: var(--radius-md); padding: calc(var(--spacing)*1) calc(var(--spacing)*3); }
.btn[aria-pressed="true"] { background: var(--uw-accent); color: var(--uw-accent-fg); border-color: var(--uw-accent); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--uw-accent); text-decoration: underline; padding-inline: 0; }

/* ---- page frame (AppShell main: max-w-page-wide px-4 md:px-8 py-8) ---- */
.frame { margin-inline: auto; width: 100%; max-width: var(--container-page-wide); container-type: inline-size; }
.frame[data-phone] { max-width: 375px; border-inline: 1px dashed var(--uw-border); }
main { padding: calc(var(--spacing)*8) calc(var(--spacing)*4); }
@container (width >= 48rem) { main { padding-inline: calc(var(--spacing)*8); } }

/* ---- 1. header ---- */
.strongs-head h1 { font-family: var(--font-scripture); font-size: var(--text-2xl); font-weight: 600; line-height: 1.25; }
.strongs-head .orig { font-family: var(--font-original); color: var(--uw-accent); font-weight: 400; }
.strongs-head .translit { font-style: italic; font-weight: 400; }
.strongs-head .sub { margin-top: calc(var(--spacing)*1); font-size: var(--text-lg); color: var(--uw-fg-muted); }
.stat-line { margin-top: calc(var(--spacing)*2); display: flex; flex-wrap: wrap; gap: calc(var(--spacing)*2) calc(var(--spacing)*4); font-size: var(--text-sm); color: var(--uw-fg-muted); }
.stat-line b { color: var(--uw-fg); font-size: var(--text-base); }
@container (width >= 48rem) { .strongs-head h1 { font-size: var(--text-3xl); } }
@container (width >= 160rem) { .strongs-head h1 { font-size: var(--text-4xl); } }

/* ---- sections ---- */
.stats { display: grid; gap: calc(var(--spacing)*10); margin-top: calc(var(--spacing)*8); }
.stats h2 { font-family: var(--font-scripture); font-size: var(--text-xl); font-weight: 600; }
.stats h2 + p { font-size: var(--text-sm); color: var(--uw-fg-muted); }
@container (width >= 48rem) { .stats h2 { font-size: var(--text-2xl); } }

/* ---- 2. Gebildet aus (EmptyState + future LemmaRow skeleton) ---- */
.empty-state { margin-top: calc(var(--spacing)*3); border: 1px dashed var(--uw-border); border-radius: var(--radius-lg); padding: calc(var(--spacing)*4); display: grid; gap: calc(var(--spacing)*3); }
.empty-state .lead { font-size: var(--text-sm); color: var(--uw-fg-muted); }
.lemma-row { display: grid; grid-template-columns: auto minmax(0,1fr); align-items: center; gap: calc(var(--spacing)*1) calc(var(--spacing)*3);
  border-radius: var(--radius-md); background: var(--uw-surface-muted); padding: calc(var(--spacing)*2) calc(var(--spacing)*3); }
.lemma-row .count { grid-column: 2; font-size: var(--text-xs); color: var(--uw-fg-muted); }
@container (width >= 40rem) { .lemma-row { grid-template-columns: auto minmax(0,1fr) auto; } .lemma-row .count { grid-column: auto; } }
.badge { font-size: var(--text-xs); font-weight: 600; border-radius: var(--radius-sm); padding: 0 calc(var(--spacing)*2);
  background: var(--uw-mark-same); color: var(--uw-fg); white-space: nowrap; }
.skeleton { opacity: .55; }
.skeleton .bone { display: inline-block; height: 0.75em; border-radius: var(--radius-sm); background: var(--uw-border); }
.w-12{width:3rem}.w-40{width:10rem}.w-24{width:6rem}.w-32{width:8rem}

/* ---- 3. BookBarChart ---- */
.legend { display: flex; flex-wrap: wrap; gap: calc(var(--spacing)*1) calc(var(--spacing)*4); margin: calc(var(--spacing)*3) 0 0; padding: 0; list-style: none; font-size: var(--text-xs); color: var(--uw-fg-muted); }
.legend li { display: inline-flex; align-items: center; gap: calc(var(--spacing)*1.5); }
.swatch { width: calc(var(--spacing)*3); height: calc(var(--spacing)*3); border-radius: var(--radius-sm); background: var(--c); flex: none; }
.chart-tools { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: calc(var(--spacing)*2); }
.testament { margin-top: calc(var(--spacing)*5); }
.testament h3 { font-size: var(--text-sm); font-weight: 600; color: var(--uw-fg-muted); text-transform: uppercase; letter-spacing: .04em; }
.testaments { display: grid; gap: calc(var(--spacing)*4); }
@container (width >= 150rem) { .testaments[data-both] { grid-template-columns: 39fr 27fr; gap: calc(var(--spacing)*8); } }

/* column layout (>= 40rem container): one <li> per book; count + bar + staggered abbreviation */
.cols { display: none; list-style: none; margin: calc(var(--spacing)*2) 0 0; padding: 0; }
.cols li { flex: 1 1 0; min-width: 0; display: grid; grid-template-rows: calc(var(--spacing)*36) auto auto; position: relative; }
.cols .plot { display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; padding-inline: 1px; }
.cols .val { font-size: var(--text-xs); text-align: center; color: var(--uw-fg-muted); line-height: 1.4; }
/* --v (0..1) = count / max; the only dynamic value. In React: style={{"--v": ratio}} (needs a lint exception, see design doc) */
.cols .bar { height: calc(var(--v) * (100% - 1.2em)); min-height: 2px; background: var(--c); border-radius: 4px 4px 0 0; }
.cols li[data-zero] .bar { background: var(--uw-chart-empty); border-radius: 0; }
.cols .abbr { font-size: var(--text-xs); text-align: center; white-space: nowrap; line-height: 1.2; padding-top: calc(var(--spacing)*1); }
.cols li:nth-child(even) .abbr { padding-top: calc(var(--spacing)*5); } /* staggered second row */
.cols li:nth-child(even) .abbr::before { content: ""; position: absolute; left: 50%; top: calc(var(--spacing)*36 + 2px); height: calc(var(--spacing)*3.5); border-left: 1px solid var(--uw-border); }
.cols li[data-zero] .abbr { color: var(--uw-fg-muted); opacity: .7; }
.cols li a { color: inherit; text-decoration: none; display: contents; }
.cols li:hover .bar, .cols li:focus-within .bar { filter: brightness(1.12); }
.cols .tip { display: none; position: absolute; bottom: calc(100% - var(--spacing)*30); left: 50%; translate: -50% 0; z-index: 2; white-space: nowrap;
  background: var(--uw-surface); color: var(--uw-fg); border: 1px solid var(--uw-border); border-radius: var(--radius-md); padding: calc(var(--spacing)*1) calc(var(--spacing)*2); font-size: var(--text-xs); box-shadow: 0 2px 8px oklch(0 0 0 / .15); }
.cols li:hover .tip, .cols li:focus-within .tip { display: block; }
@container (width >= 40rem) { .chart:not([data-view="list"]) .cols { display: flex; } .chart:not([data-view="list"]) .rows-wrap { display: none; } }
@container (width >= 100rem) { .cols li { grid-template-rows: calc(var(--spacing)*48) auto auto; } .cols li:nth-child(even) .abbr::before { top: calc(var(--spacing)*48 + 2px); } .cols .tip { bottom: calc(100% - var(--spacing)*42); } }
@container (width >= 150rem) { .cols .val, .cols .abbr { font-size: var(--text-sm); } }

/* list layout (phones, and the "Als Liste" view): only books with occurrences + a line of books without */
.rows { list-style: none; margin: calc(var(--spacing)*2) 0 0; padding: 0; display: grid; gap: calc(var(--spacing)*1); }
.rows li { display: grid; grid-template-columns: calc(var(--spacing)*12) minmax(0,1fr) calc(var(--spacing)*8); align-items: center; gap: calc(var(--spacing)*2); font-size: var(--text-sm); }
.rows .track { height: calc(var(--spacing)*3); }
.rows .bar { height: 100%; width: calc(var(--v) * 100%); min-width: 2px; background: var(--c); border-radius: 0 4px 4px 0; }
.rows .val { text-align: right; font-variant-numeric: tabular-nums; }
.rows a { color: var(--uw-accent); }
.zero-line { margin-top: calc(var(--spacing)*2); font-size: var(--text-xs); color: var(--uw-fg-muted); }
@container (width >= 40rem) { .rows li { grid-template-columns: calc(var(--spacing)*40) minmax(0,1fr) calc(var(--spacing)*10); } }

/* ---- 4. DonutChart ---- */
.donuts { display: grid; gap: calc(var(--spacing)*8); margin-top: calc(var(--spacing)*3); }
@container (width >= 48rem) { .donuts { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@container (width >= 72rem) { .donuts { grid-template-columns: repeat(3, minmax(0,1fr)); } }
.donut { display: grid; gap: calc(var(--spacing)*3); align-content: start; border: 1px solid var(--uw-border); border-radius: var(--radius-lg); background: var(--uw-surface); padding: calc(var(--spacing)*4); }
.donut h3 { font-family: var(--font-scripture); font-size: var(--text-lg); font-weight: 600; }
.donut h3 .orig { font-family: var(--font-original); color: var(--uw-accent); font-weight: 400; }
.donut .total { font-size: var(--text-sm); color: var(--uw-fg-muted); }
.donut label { display: flex; align-items: center; gap: calc(var(--spacing)*2); font-size: var(--text-sm); }
.select { font: inherit; font-size: var(--text-sm); color: var(--uw-fg); background: var(--uw-surface); border: 1px solid var(--uw-border); border-radius: var(--radius-md); padding: calc(var(--spacing)*1) calc(var(--spacing)*2); min-width: 0; flex: 1; max-width: calc(var(--spacing)*72); }
.donut-body { display: grid; grid-template-columns: calc(var(--spacing)*32) minmax(0,1fr); gap: calc(var(--spacing)*4); align-items: center; }
@container (width >= 150rem) { .donut-body { grid-template-columns: calc(var(--spacing)*44) minmax(0,1fr); } }
.ring { position: relative; aspect-ratio: 1; }
.ring svg { width: 100%; height: 100%; rotate: -90deg; display: block; }
.ring circle { fill: none; stroke-width: 7; }
.ring .track { stroke: var(--uw-chart-empty); }
.ring .seg { stroke: var(--c); transition: opacity .15s; }
.donut[data-filtered] .seg:not([data-active]) { opacity: .25; }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .center b { font-size: var(--text-3xl); line-height: 1; }
.ring .center span { font-size: var(--text-xs); color: var(--uw-fg-muted); max-width: 6rem; line-height: 1.2; }
.slices { list-style: none; margin: 0; padding: 0; display: grid; gap: calc(var(--spacing)*1); font-size: var(--text-sm); }
.slices li { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: calc(var(--spacing)*2); align-items: baseline; }
.slices .swatch { align-self: center; }
.slices .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slices .lbl .o { font-family: var(--font-original); }
.slices .n { font-variant-numeric: tabular-nums; color: var(--uw-fg-muted); white-space: nowrap; }
.slices li[data-active] { font-weight: 600; }
.slices li[data-active] .n { color: var(--uw-fg); }
.slices a { color: inherit; }
.donut-note { font-size: var(--text-xs); color: var(--uw-fg-muted); }
.attribution { margin-top: calc(var(--spacing)*10); font-size: var(--text-xs); color: var(--uw-fg-muted); }
.kwic-stub { margin-top: calc(var(--spacing)*10); border-top: 1px solid var(--uw-border); padding-top: calc(var(--spacing)*4); }
.kwic-stub h2 { font-family: var(--font-scripture); font-size: var(--text-xl); font-weight: 600; }
</style>
</head>
<body>

<div class="mock-bar" role="toolbar" aria-label="Mockup-Steuerung">
  <strong>Mockup</strong>
  <span>Theme:</span>
  <button class="btn" data-theme-set="system" aria-pressed="true">System</button>
  <button class="btn" data-theme-set="light" aria-pressed="false">Hell</button>
  <button class="btn" data-theme-set="dark" aria-pressed="false">Dunkel</button>
  <span>· Breite:</span>
  <button class="btn" data-width="full" aria-pressed="true">Fenster</button>
  <button class="btn" data-width="phone" aria-pressed="false">375 px</button>
  <span>· Beispiel:</span>
  <button class="btn" data-scenario="strongs" aria-pressed="true">Strong G1577 (nur NT)</button>
  <button class="btn" data-scenario="word" aria-pressed="false">Wortsuche »Versammlung« (AT + NT)</button>
</div>

<div class="frame" id="frame">
<main id="page"></main>
</div>

<script>
/* ----------------------------- sample data ----------------------------- */
const SECTIONS = [
  ["law","Gesetz",1,5],["history","Geschichte",6,17],["wisdom","Poesie & Weisheit",18,22],["prophets","Propheten",23,39],
  ["gospels","Evangelien & Apg",40,44],["paul","Paulusbriefe",45,57],["general","Hebr. & allg. Briefe",58,65],["revelation","Offenbarung",66,66]];
const BOOKS = ("1Mo|1. Mose,2Mo|2. Mose,3Mo|3. Mose,4Mo|4. Mose,5Mo|5. Mose,Jos|Josua,Ri|Richter,Rt|Ruth,1Sam|1. Samuel,2Sam|2. Samuel,1Kön|1. Könige,2Kön|2. Könige,1Chr|1. Chronika,2Chr|2. Chronika,Esra|Esra,Neh|Nehemia,Est|Esther,Hiob|Hiob,Ps|Psalmen,Spr|Sprüche,Pred|Prediger,Hld|Hohelied,Jes|Jesaja,Jer|Jeremia,Klgl|Klagelieder,Hes|Hesekiel,Dan|Daniel,Hos|Hosea,Joel|Joel,Amos|Amos,Obad|Obadja,Jona|Jona,Mich|Micha,Nah|Nahum,Hab|Habakuk,Zeph|Zephanja,Hag|Haggai,Sach|Sacharja,Mal|Maleachi,"
 + "Mt|Matthäus,Mk|Markus,Lk|Lukas,Joh|Johannes,Apg|Apostelgeschichte,Röm|Römer,1Kor|1. Korinther,2Kor|2. Korinther,Gal|Galater,Eph|Epheser,Phil|Philipper,Kol|Kolosser,1Thes|1. Thessalonicher,2Thes|2. Thessalonicher,1Tim|1. Timotheus,2Tim|2. Timotheus,Tit|Titus,Phlm|Philemon,Heb|Hebräer,Jak|Jakobus,1Pet|1. Petrus,2Pet|2. Petrus,1Joh|1. Johannes,2Joh|2. Johannes,3Joh|3. Johannes,Jud|Judas,Off|Offenbarung")
  .split(",").map((s, i) => { const [abbr, name] = s.split("|"); const id = i + 1;
    return { id, abbr, name, testament: id <= 39 ? "ot" : "nt", section: SECTIONS.find(([, , a, b]) => id >= a && id <= b)[0] }; });

// G1577 per NT book (Elb1871 mapping; sums to 114)
const NT_G1577 = {40:3,44:23,45:5,46:22,47:9,48:3,49:9,50:2,51:4,52:2,53:2,54:3,57:1,58:2,59:1,64:3,66:20};
// »Versammlung« in the OT (sums to 133)
const OT_VERS = {1:1,2:4,3:15,4:18,5:12,6:1,7:3,9:2,11:6,13:7,14:26,15:5,16:6,18:1,19:12,20:3,23:2,24:3,25:1,26:3,29:1,33:1};

const SCENARIOS = {
  strongs: {
    head: { strongs: "G1577", lemma: "ἐκκλησία", lang: "el", translit: "ekklēsia", language: "Griechisch", gloss: "Versammlung", glossEn: "church, assembly" },
    total: 114, verses: 111, books: 17, booksTotal: 27,
    chartTitle: "Vorkommen im Neuen Testament", testaments: { nt: NT_G1577 },
    donuts: [
      { title: ["G1577 – ", ["ἐκκλησία","el"], " – ekklēsia"], total: "114 Vorkommen in 111 Versen", centerValue: 1, centerLabel: "Übersetzung in 114 Vorkommen",
        filterLabel: "Übersetzung", slices: [{ key: "Versammlung", label: "Versammlung", count: 114 }],
        note: "Wie die Elberfelder 1871 dieses Wort wiedergibt." },
      { title: ["»Versammlung« im AT"], total: "133 Vorkommen in 125 Versen", centerValue: 7, centerLabel: "hebr. Wörter in 133 Vorkommen",
        filterLabel: "Strong", slices: [
          { key: "H6951", label: "H6951", o: ["קָהָל","he"], tr: "qahal", count: 105 },
          { key: "H4744", label: "H4744", o: ["מִקְרָא","he"], tr: "miqra'", count: 21 },
          { key: "H4721", label: "H4721", o: ["מַקְהֵל","he"], tr: "maqhel", count: 2 },
          { key: "H6952", label: "H6952", o: ["קְהִלָּה","he"], tr: "q'hillah", count: 2 },
          { key: "H3862", label: "H3862", o: ["לַהֲקָה","he"], tr: "lahaqah", count: 1 },
          { key: "H4150", label: "H4150", o: ["מוֹעֵד","he"], tr: "mo'ed", count: 1 },
          { key: "H5475", label: "H5475", o: ["סוֹד","he"], tr: "sod", count: 1 }],
        note: "Welche Grundtextwörter hinter »Versammlung« stehen." },
      { title: ["»Versammlung« im NT"], total: "114 Vorkommen in 111 Versen", centerValue: 1, centerLabel: "griech. Wort in 114 Vorkommen",
        filterLabel: "Strong", highlight: "G1577", slices: [{ key: "G1577", label: "G1577", o: ["ἐκκλησία","el"], tr: "ekklēsia", count: 114 }],
        note: "Dieses Strong-Wort ist hervorgehoben." }]
  },
  word: {
    head: null, wordTitle: "Wortsuche »Versammlung«", total: 247, verses: 236, books: 39, booksTotal: 66,
    chartTitle: "Vorkommen im Bibeltext", testaments: { ot: OT_VERS, nt: NT_G1577 },
    donuts: null
  }
};

/* ----------------------------- render helpers ----------------------------- */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtPct = (n, t) => (t ? Math.round((n / t) * 1000) / 10 : 0).toLocaleString("de-DE") + " %";

function header(s) {
  if (!s.head) return `<header class="strongs-head"><h1>${esc(s.wordTitle)}</h1>
    <p class="stat-line"><span><b>${s.total}</b> Vorkommen</span><span><b>${s.verses}</b> Verse</span><span><b>${s.books}</b> von ${s.booksTotal} Büchern</span></p></header>`;
  const h = s.head;
  return `<header class="strongs-head">
    <h1>Strong ${h.strongs} – <span class="orig" lang="${h.lang}">${h.lemma}</span> – <span class="translit">${h.translit}</span></h1>
    <p class="sub">${h.language} – ${h.gloss} <span lang="en" title="Englische Lexikon-Glosse (STEP)">(${h.glossEn})</span></p>
    <p class="stat-line"><span><b>${s.total}</b> Vorkommen</span><span><b>${s.verses}</b> Verse</span><span><b>${s.books}</b> von ${s.booksTotal} NT-Büchern</span></p>
  </header>`;
}

function composedOf() {
  // EmptyState with a skeleton of the future LemmaRow, so the final layout is already visible.
  const skel = (w1, w2) => `<div class="lemma-row skeleton" aria-hidden="true"><span class="badge">G····</span>
     <span><span class="bone ${w1}"></span> <span class="bone ${w2}"></span></span><span class="count"><span class="bone w-24"></span></span></div>`;
  return `<section aria-labelledby="h-composed">
    <h2 id="h-composed">Gebildet aus</h2>
    <div class="empty-state">
      <p class="lead">Die Wortbildung (aus welchen Wörtern ${"ἐκκλησία"} zusammengesetzt ist) wird noch aufbereitet und erscheint hier später.</p>
      ${skel("w-12", "w-40")}${skel("w-12", "w-32")}
    </div>
    <!-- Later, filled: one LemmaRow per part
    <a class="lemma-row" href="/bible/strongs/G1537"><span class="badge">G1537</span>
      <span><span lang="el">ἐκ</span> – <i>ek</i> – aus; von</span><span class="count">923 Mal in 756 Versen</span></a> -->
  </section>`;
}

function bookChart(s, view) {
  const all = Object.values(s.testaments).flatMap((m) => Object.values(m));
  const max = Math.max(...all); // one scale for OT and NT, so bars are comparable
  const usedSections = new Set();
  const parts = Object.entries(s.testaments).map(([t, counts]) => {
    const books = BOOKS.filter((b) => b.testament === t);
    const total = books.reduce((a, b) => a + (counts[b.id] || 0), 0);
    books.forEach((b) => counts[b.id] && usedSections.add(b.section));
    const cols = books.map((b) => {
      const n = counts[b.id] || 0;
      const v = (n / max).toFixed(4);
      return `<li data-section="${b.section}" ${n ? "" : "data-zero"} style="--v:${v}">
        <a href="${n ? `#book-${b.id}` : ""}" ${n ? "" : 'tabindex="-1" aria-disabled="true"'}>
          <span class="plot" aria-hidden="true"><span class="val">${n || ""}</span><span class="bar"></span></span>
          <span class="abbr" aria-hidden="true">${b.abbr}</span>
          <span class="sr-only">${b.name}: ${n}</span>
          <span class="tip" aria-hidden="true">${b.name}: <b>${n}</b> (${fmtPct(n, total)})</span>
        </a></li>`;
    }).join("");
    const used = books.filter((b) => counts[b.id]);
    const zero = books.filter((b) => !counts[b.id]);
    const rows = used.map((b) => `<li data-section="${b.section}" style="--v:${(counts[b.id] / max).toFixed(4)}">
        <a href="#book-${b.id}" title="${b.name}">${b.abbr}</a><span class="track" aria-hidden="true"><span class="bar" style="display:block"></span></span>
        <span class="val">${counts[b.id]}</span></li>`).join("");
    const label = t === "ot" ? "Altes Testament" : "Neues Testament";
    return `<div class="testament" aria-label="${label}">
      ${Object.keys(s.testaments).length > 1 ? `<h3>${label} · ${total}</h3>` : ""}
      <ol class="cols" aria-label="${label}: Vorkommen je Buch">${cols}</ol>
      <div class="rows-wrap"><ol class="rows" aria-label="${label}: Bücher mit Vorkommen">${rows}</ol>
      ${zero.length ? `<p class="zero-line rows-zero">Ohne Vorkommen (${zero.length}): ${zero.map((b) => b.abbr).join(", ")}</p>` : ""}</div>
    </div>`;
  }).join("");
  const legend = SECTIONS.filter(([k]) => usedSections.has(k))
    .map(([k, name]) => `<li data-section="${k}"><span class="swatch"></span>${name}</li>`).join("");
  return `<section aria-labelledby="h-books">
    <div class="chart-tools"><h2 id="h-books">${s.chartTitle}</h2>
      <button class="btn btn-ghost" id="toggle-view" aria-pressed="${view === "list"}">${view === "list" ? "Als Diagramm" : "Als Liste"}</button></div>
    <p>${s.total} Vorkommen in ${s.books} von ${s.booksTotal} Büchern</p>
    <ul class="legend" aria-label="Farben: Bibelteile">${legend}</ul>
    <figure class="chart" data-view="${view}" style="margin:0">
      <div class="testaments" ${Object.keys(s.testaments).length > 1 ? "data-both" : ""}>${parts}</div>
    </figure>
  </section>`;
}

function donut(d, i, filter) {
  const total = d.slices.reduce((a, x) => a + x.count, 0);
  const active = filter || d.highlight || null;
  const C = 2 * Math.PI * 40, gap = d.slices.length > 1 ? 0.6 : 0; // ~2px surface gap between segments
  let off = 0;
  const segs = d.slices.map((x, k) => {
    const len = (x.count / total) * 100;
    const seg = `<circle class="seg" data-section="" style="--c:var(--uw-chart-${k + 1})" ${active === x.key ? "data-active" : ""}
      cx="50" cy="50" r="40" pathLength="100" stroke-dasharray="${Math.max(len - gap, 0.4)} ${100 - Math.max(len - gap, 0.4)}" stroke-dashoffset="${-off}"></circle>`;
    off += len; return seg;
  }).join("");
  const shown = filter ? d.slices.find((x) => x.key === filter) : null;
  const li = d.slices.map((x, k) => `<li ${active === x.key ? "data-active" : ""}><span class="swatch" style="--c:var(--uw-chart-${k + 1})"></span>
      <span class="lbl">${x.o ? `<a href="#strongs-${x.key}">${x.label}</a> – <span class="o" lang="${x.o[1]}">${x.o[0]}</span> – <i>${x.tr}</i>` : esc(x.label)}</span>
      <span class="n">${x.count}× · ${fmtPct(x.count, total)}</span></li>`).join("");
  const opts = [`<option value="">Alle anzeigen</option>`].concat(d.slices.map((x) =>
    `<option value="${x.key}" ${filter === x.key ? "selected" : ""}>${x.label}${x.tr ? " – " + x.tr : ""} – ${x.count}×</option>`)).join("");
  const title = d.title.map((p) => Array.isArray(p) ? `<span class="orig" lang="${p[1]}">${p[0]}</span>` : esc(p)).join("");
  return `<figure class="donut" ${filter ? "data-filtered" : ""} aria-labelledby="dn-${i}" style="margin:0">
    <div><h3 id="dn-${i}">${title}</h3><p class="total">${d.total}</p></div>
    <label>${d.filterLabel}: <select class="select" data-donut="${i}" ${d.slices.length < 2 ? "disabled" : ""}>${opts}</select></label>
    <div class="donut-body">
      <div class="ring" aria-hidden="true"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="40"></circle>${segs}</svg>
        <div class="center"><b>${shown ? shown.count : d.centerValue}</b><span>${shown ? "von " + total + " Vorkommen" : d.centerLabel}</span></div></div>
      <ul class="slices" aria-label="${esc(d.title.map((p) => (Array.isArray(p) ? p[0] : p)).join(""))}: Anteile">${li}</ul>
    </div>
    <figcaption class="donut-note">${d.note}</figcaption>
  </figure>`;
}

/* ----------------------------- state + wiring ----------------------------- */
const state = { scenario: "strongs", view: "auto", filters: {} };
function render() {
  const s = SCENARIOS[state.scenario];
  document.getElementById("page").innerHTML = header(s)
    + `<div class="stats">`
    + (s.head ? composedOf() : "")
    + bookChart(s, state.view)
    + (s.donuts ? `<section aria-labelledby="h-donuts"><h2 id="h-donuts">Übersetzung und Grundtext</h2>
        <div class="donuts">${s.donuts.map((d, i) => donut(d, i, state.filters[i])).join("")}</div></section>` : "")
    + `</div>`
    + `<section class="kwic-stub"><h2>Alle Stellen</h2><p class="muted">… bestehende Konkordanz (KWIC-Liste mit Seiten) folgt hier unverändert …</p></section>`
    + `<p class="attribution">Grundtextdaten: STEP Bible (CC BY 4.0), nur zur Laufzeit geladen.</p>`;
  document.getElementById("toggle-view").onclick = () => { state.view = state.view === "list" ? "auto" : "list"; render(); };
  document.querySelectorAll("select[data-donut]").forEach((el) => el.onchange = () => { state.filters[el.dataset.donut] = el.value || undefined; render(); });
  document.querySelectorAll(".chart[data-view='auto'] .rows-wrap").forEach(() => {});
}
// "Als Liste" forces the list view at every width
const style = document.createElement("style");
style.textContent = `.chart[data-view="list"] .cols{display:none!important}`;
document.head.append(style);

function press(attr, val) { document.querySelectorAll(`[${attr}]`).forEach((b) => b.setAttribute("aria-pressed", String(b.getAttribute(attr) === val))); }
document.querySelectorAll("[data-theme-set]").forEach((b) => b.onclick = () => {
  const v = b.dataset.themeSet; if (v === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = v; press("data-theme-set", v); });
document.querySelectorAll("[data-width]").forEach((b) => b.onclick = () => {
  document.getElementById("frame").toggleAttribute("data-phone", b.dataset.width === "phone"); press("data-width", b.dataset.width); });
document.querySelectorAll("[data-scenario]").forEach((b) => b.onclick = () => { state.scenario = b.dataset.scenario; state.filters = {}; press("data-scenario", b.dataset.scenario); render(); });
render();
</script>
