<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemma Bulk-Edit Mockup</title>
<style>
/* Design tokens as in lemma-editor.html / src/styles/index.css. No new colour tokens. */
:root {
  color-scheme: light;
  --spacing: 0.25rem;
  --radius-sm: 0.25rem; --radius-md: 0.375rem; --radius-lg: 0.5rem;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem; --text-lg: 1.125rem; --text-2xl: 1.5rem;
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-scripture: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --container-page-wide: 120rem;
  --uw-bg: oklch(0.99 0.004 85);
  --uw-surface: oklch(1 0 0);
  --uw-surface-muted: oklch(0.96 0.006 85);
  --uw-fg: oklch(0.22 0.01 60);
  --uw-fg-muted: oklch(0.48 0.01 60);
  --uw-border: oklch(0.88 0.008 80);
  --uw-accent: oklch(0.42 0.1 30);
  --uw-accent-fg: oklch(0.99 0.004 85);
  --uw-focus: oklch(0.6 0.15 250);
  --uw-mark-same: oklch(0.88 0.08 240);
  --uw-mark-linked: oklch(0.9 0.14 95);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --uw-bg: oklch(0.18 0.008 60); --uw-surface: oklch(0.22 0.01 60); --uw-surface-muted: oklch(0.27 0.012 60);
  --uw-fg: oklch(0.94 0.005 85); --uw-fg-muted: oklch(0.7 0.01 70); --uw-border: oklch(0.34 0.012 60);
  --uw-accent: oklch(0.78 0.1 50); --uw-accent-fg: oklch(0.2 0.01 60); --uw-focus: oklch(0.72 0.14 250);
  --uw-mark-same: oklch(0.42 0.09 240); --uw-mark-linked: oklch(0.5 0.1 90);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --uw-bg: oklch(0.18 0.008 60); --uw-surface: oklch(0.22 0.01 60); --uw-surface-muted: oklch(0.27 0.012 60);
    --uw-fg: oklch(0.94 0.005 85); --uw-fg-muted: oklch(0.7 0.01 70); --uw-border: oklch(0.34 0.012 60);
    --uw-accent: oklch(0.78 0.1 50); --uw-accent-fg: oklch(0.2 0.01 60); --uw-focus: oklch(0.72 0.14 250);
    --uw-mark-same: oklch(0.42 0.09 240); --uw-mark-linked: oklch(0.5 0.1 90);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; background: var(--uw-bg); color: var(--uw-fg); font-family: var(--font-sans); }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--uw-focus); outline-offset: 2px; }
.muted { color: var(--uw-fg-muted); }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

.mock-bar { display: flex; flex-wrap: wrap; gap: calc(var(--spacing)*2); align-items: center; flex: none;
  padding: calc(var(--spacing)*2) calc(var(--spacing)*4); background: var(--uw-surface-muted); border-bottom: 1px solid var(--uw-border); font-size: var(--text-sm); }
.mock-bar strong { margin-right: calc(var(--spacing)*2); }

.btn { font: inherit; font-size: var(--text-sm); cursor: pointer; border: 1px solid var(--uw-border); background: var(--uw-surface); color: var(--uw-fg);
  border-radius: var(--radius-md); padding: calc(var(--spacing)*1) calc(var(--spacing)*2); white-space: nowrap; }
.btn:hover { background: var(--uw-surface-muted); }
.btn[aria-pressed="true"] { background: var(--uw-accent); color: var(--uw-accent-fg); border-color: var(--uw-accent); }
.btn-primary { background: var(--uw-accent); color: var(--uw-accent-fg); border-color: var(--uw-accent); }
.btn-primary:hover { background: var(--uw-accent); opacity: .9; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-md { font-size: var(--text-base); padding: calc(var(--spacing)*2) calc(var(--spacing)*4); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { padding: 0 calc(var(--spacing)*1); border-color: transparent; background: transparent; color: var(--uw-fg-muted); }

.stage { position: relative; flex: 1; min-height: 0; display: flex; }
.frame { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-inline: auto; width: 100%; overflow: auto; }
.frame[data-phone] { max-width: 375px; border-inline: 1px dashed var(--uw-border); }
.app-header { flex: none; position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: calc(var(--spacing)*6); height: calc(var(--spacing)*14);
  padding-inline: calc(var(--spacing)*4); border-bottom: 1px solid var(--uw-border); background: var(--uw-surface); }
.brand { font-family: var(--font-scripture); font-size: var(--text-lg); font-weight: 600; color: var(--uw-accent); }
.app-header .spacer { flex: 1; }
.avatar { width: calc(var(--spacing)*8); height: calc(var(--spacing)*8); border-radius: 999px; background: var(--uw-accent); color: var(--uw-accent-fg); display: grid; place-items: center; font-size: var(--text-sm); }

main { flex: 1; min-height: 0; width: 100%; max-width: var(--container-page-wide); margin-inline: auto; display: flex; flex-direction: column; gap: calc(var(--spacing)*3);
  padding: calc(var(--spacing)*4) calc(var(--spacing)*4) 0; }
@media (min-width: 48rem) { main { padding-inline: calc(var(--spacing)*8); } }
.ed-head h1 { font-family: var(--font-scripture); font-size: var(--text-2xl); font-weight: 600; }
.ed-sum { font-size: var(--text-sm); color: var(--uw-fg-muted); margin-top: calc(var(--spacing)*1); }
.filters { display: flex; flex-wrap: wrap; gap: calc(var(--spacing)*2) calc(var(--spacing)*3); align-items: center; font-size: var(--text-sm); }
.filters .count { margin-left: auto; color: var(--uw-fg-muted); }

.gscroll { min-height: 0; overflow: auto; border: 1px solid var(--uw-border); border-radius: var(--radius-lg); background: var(--uw-surface); }
.grid { width: max-content; min-width: 100%; font-size: var(--text-sm); }
.row { display: flex; height: calc(var(--spacing)*9); border-bottom: 1px solid var(--uw-border); background: var(--uw-surface); }
.ghead { position: sticky; top: 0; z-index: 3; }
.ghead .row { background: var(--uw-surface-muted); font-weight: 600; font-size: var(--text-xs); }
.cell { flex: none; display: flex; align-items: center; gap: calc(var(--spacing)*1); padding-inline: calc(var(--spacing)*2); white-space: nowrap; overflow: hidden; background: inherit; cursor: default; }
.c-v { width: 3.5rem; color: var(--uw-fg-muted); font-variant-numeric: tabular-nums; }
.c-w { width: 10.5rem; font-family: var(--font-scripture); font-size: var(--text-base); }
.ghead .c-w { font-family: var(--font-sans); font-size: var(--text-xs); }
.c-plain { width: 9rem; color: var(--uw-fg-muted); }
.c-lemma { width: 10.5rem; }
.c-upos { width: 8.5rem; }
.c-f { width: 7rem; }
.row[data-active-row] { background: var(--uw-surface-muted); }
.row[data-dirty] .c-v { box-shadow: inset 3px 0 0 var(--uw-accent); }
.cell[data-changed] { background: var(--uw-mark-linked); }
.vsep { border-top: 2px solid var(--uw-border); }
.savebar { display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--spacing)*3); padding: calc(var(--spacing)*3) 0 calc(var(--spacing)*4); border-top: 1px solid var(--uw-border); font-size: var(--text-sm); }
.savebar[hidden] { display: none; }
.savebar .msg { flex: 1 1 14rem; }
.toast { position: absolute; left: 50%; bottom: calc(var(--spacing)*4); transform: translateX(-50%); z-index: 60; background: var(--uw-fg); color: var(--uw-bg); padding: calc(var(--spacing)*2) calc(var(--spacing)*4); border-radius: var(--radius-md); font-size: var(--text-sm); }
.toast[hidden] { display: none; }

/* ------------------------- dialog ------------------------- */
.overlay { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center;
  background: color-mix(in oklab, var(--uw-fg) 45%, transparent); padding: calc(var(--spacing)*4); }
.overlay[hidden] { display: none; }
.stage[data-phone] .overlay { inset: 0 auto 0 50%; transform: translateX(-50%); width: 375px; padding: 0; }
.dlg { container-type: inline-size; container-name: dlg; width: min(68rem, 100%); height: min(46rem, 100%); display: flex; flex-direction: column;
  background: var(--uw-surface); color: var(--uw-fg); border: 1px solid var(--uw-border); border-radius: var(--radius-lg); overflow: hidden; }
.stage[data-phone] .dlg { width: 100%; height: 100%; border-radius: 0; border: 0; }
.dlg-head { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--spacing)*2) calc(var(--spacing)*4); padding: calc(var(--spacing)*3) calc(var(--spacing)*4); border-bottom: 1px solid var(--uw-border); }
.dlg-head h2 { font-size: var(--text-lg); font-weight: 600; font-family: var(--font-scripture); }
.steps { display: flex; gap: calc(var(--spacing)*1); list-style: none; margin: 0 auto 0 0; padding: 0; font-size: var(--text-sm); color: var(--uw-fg-muted); }
.steps li { padding: 0 calc(var(--spacing)*2); border-radius: 999px; }
.steps li[aria-current="step"] { background: var(--uw-accent); color: var(--uw-accent-fg); }
.steps li[data-done] { color: var(--uw-fg); }
.dlg-body { flex: 1; min-height: 0; overflow: auto; padding: calc(var(--spacing)*4); display: flex; flex-direction: column; gap: calc(var(--spacing)*4); }
.dlg-body.flush { padding: 0; gap: 0; overflow: hidden; }
.dlg-foot { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--spacing)*2) calc(var(--spacing)*3); padding: calc(var(--spacing)*3) calc(var(--spacing)*4); border-top: 1px solid var(--uw-border); background: var(--uw-surface-muted); font-size: var(--text-sm); }
.dlg-foot .grow { flex: 1; }
.dlg-foot .actions { display: flex; gap: calc(var(--spacing)*2); }

.sect { display: grid; gap: calc(var(--spacing)*2); }
.sect > label, .sect > .lbl { font-size: var(--text-sm); font-weight: 600; }
.help { font-size: var(--text-xs); color: var(--uw-fg-muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--spacing)*5); }
@container dlg (max-width: 44rem) { .two { grid-template-columns: 1fr; } }
input[type="text"], input[type="number"], select { font: inherit; font-size: var(--text-sm); color: var(--uw-fg); background: var(--uw-surface); border: 1px solid var(--uw-border);
  border-radius: var(--radius-md); padding: calc(var(--spacing)*1) calc(var(--spacing)*2); min-width: 0; }
input[type="number"] { width: 5rem; }
.chips { display: flex; flex-wrap: wrap; gap: calc(var(--spacing)*1) calc(var(--spacing)*2); align-items: center; padding: calc(var(--spacing)*1) calc(var(--spacing)*2); border: 1px solid var(--uw-border); border-radius: var(--radius-md); min-height: 2.25rem; }
.chips input { border: 0; flex: 1; min-width: 7rem; padding-inline: 0; }
.chips input:focus-visible { outline: none; }
.chips:focus-within { outline: 2px solid var(--uw-focus); outline-offset: 1px; }
.chip { display: inline-flex; align-items: center; gap: calc(var(--spacing)*1); font-size: var(--text-sm); background: var(--uw-surface-muted); border: 1px solid var(--uw-border); border-radius: 999px; padding: 0 calc(var(--spacing)*1) 0 calc(var(--spacing)*2); }
.chip button { all: unset; cursor: pointer; padding: 0 calc(var(--spacing)*1); color: var(--uw-fg-muted); border-radius: 999px; }
.chip button:hover { color: var(--uw-accent); }
.chip button:focus-visible { outline: 2px solid var(--uw-focus); }
.chip .n { color: var(--uw-fg-muted); font-variant-numeric: tabular-nums; font-size: var(--text-xs); }
.sugg { display: flex; flex-wrap: wrap; gap: calc(var(--spacing)*1); align-items: center; font-size: var(--text-xs); color: var(--uw-fg-muted); min-height: 1.5rem; }
.sugg .btn { font-size: var(--text-xs); padding: 0 calc(var(--spacing)*2); border-radius: 999px; }
.status { font-size: var(--text-sm); }
.status.warn, .err { color: var(--uw-accent); font-weight: 500; }
.radios { display: flex; flex-wrap: wrap; gap: calc(var(--spacing)*1) calc(var(--spacing)*4); font-size: var(--text-sm); }
.radios label { display: inline-flex; gap: calc(var(--spacing)*1); align-items: center; }
.scope-sel { display: flex; flex-wrap: wrap; gap: calc(var(--spacing)*2); align-items: center; font-size: var(--text-sm); }
.preview-count { padding: calc(var(--spacing)*2) calc(var(--spacing)*3); background: var(--uw-surface-muted); border-radius: var(--radius-md); font-size: var(--text-sm); }

.notice { border: 1px solid var(--uw-border); border-left: 3px solid var(--uw-accent); border-radius: var(--radius-md); padding: calc(var(--spacing)*3); display: grid; gap: calc(var(--spacing)*2); font-size: var(--text-sm); background: var(--uw-surface-muted); }
.notice b { color: var(--uw-accent); }
.notice .actions { display: flex; gap: calc(var(--spacing)*2); flex-wrap: wrap; }
.empty-state { border: 1px dashed var(--uw-border); border-radius: var(--radius-lg); padding: calc(var(--spacing)*6); display: grid; gap: calc(var(--spacing)*3); justify-items: start; margin: calc(var(--spacing)*4); }
.empty-state h3 { font-size: var(--text-lg); }
.empty-state p { font-size: var(--text-sm); color: var(--uw-fg-muted); max-width: 40rem; }

/* review */
.sumline { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--spacing)*2); padding: calc(var(--spacing)*2) calc(var(--spacing)*4); border-bottom: 1px solid var(--uw-border); font-size: var(--text-sm); }
.sumline .arrow { color: var(--uw-fg-muted); }
.sumline .grow { flex: 1; }
.rtool { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--spacing)*1) calc(var(--spacing)*3); padding: calc(var(--spacing)*2) calc(var(--spacing)*4); border-bottom: 1px solid var(--uw-border); font-size: var(--text-sm); background: var(--uw-surface-muted); }
.pager { display: inline-flex; align-items: center; gap: calc(var(--spacing)*1); }
.pager .pg { min-width: 6.5rem; text-align: center; font-variant-numeric: tabular-nums; }
.rtool label { display: inline-flex; align-items: center; gap: calc(var(--spacing)*1); }
.rtool .sep { flex: 1; }
.list { flex: 1; min-height: 0; overflow: auto; position: relative; }
.lhead, .orow, .ghdr { display: grid; grid-template-columns: 1.75rem 5.5rem minmax(0, 1fr) 11rem 7.5rem; align-items: center; column-gap: calc(var(--spacing)*2); padding-inline: calc(var(--spacing)*4); }
.lhead { position: sticky; top: 0; z-index: 2; height: calc(var(--spacing)*7); background: var(--uw-surface-muted); border-bottom: 1px solid var(--uw-border); font-size: var(--text-xs); font-weight: 600; }
.ghdr { position: sticky; top: calc(var(--spacing)*7); z-index: 1; height: calc(var(--spacing)*8); background: var(--uw-surface-muted); border-bottom: 1px solid var(--uw-border); font-size: var(--text-sm); font-weight: 600; }
.ghdr .gtitle { grid-column: 2 / -1; display: flex; gap: calc(var(--spacing)*2); align-items: baseline; }
.ghdr small { font-weight: 400; color: var(--uw-fg-muted); }
.orowwrap { content-visibility: auto; contain-intrinsic-size: auto 2.25rem; border-bottom: 1px solid var(--uw-border); }
.orow { min-height: 2.25rem; cursor: default; }
.orow:hover { background: var(--uw-surface-muted); }
.orow[data-off] .ctx, .orow[data-off] .chg { opacity: .55; }
.orow[data-stale] { outline: 2px solid var(--uw-accent); outline-offset: -2px; }
.orow:focus-visible { outline: 2px solid var(--uw-focus); outline-offset: -2px; }
.ref { font-variant-numeric: tabular-nums; color: var(--uw-fg-muted); font-size: var(--text-sm); }
.ctx { font-family: var(--font-scripture); font-size: var(--text-base); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctx .l { color: var(--uw-fg-muted); direction: rtl; unicode-bidi: plaintext; }
.ctx mark { background: var(--uw-mark-same); color: inherit; border-radius: var(--radius-sm); padding-inline: 2px; }
.chg { font-size: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chg s { color: var(--uw-fg-muted); }
.chg .stale { color: var(--uw-accent); font-size: var(--text-xs); }
.verse { padding: calc(var(--spacing)*2) calc(var(--spacing)*4) calc(var(--spacing)*3) calc(var(--spacing)*4); margin-left: calc(1.75rem + var(--spacing)*2); font-family: var(--font-scripture); line-height: 1.5; font-size: var(--text-base); }
.verse small { display: block; font-family: var(--font-sans); font-size: var(--text-xs); color: var(--uw-fg-muted); }
.verse mark { background: var(--uw-mark-same); color: inherit; border-radius: var(--radius-sm); padding-inline: 2px; }
.skel { height: calc(var(--spacing)*3); border-radius: var(--radius-sm); background: var(--uw-surface-muted); margin-block: calc(var(--spacing)*2); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
.sk-row { display: flex; align-items: center; gap: calc(var(--spacing)*3); padding: 0 calc(var(--spacing)*4); height: 2.25rem; border-bottom: 1px solid var(--uw-border); }
.done { display: grid; gap: calc(var(--spacing)*3); justify-items: start; }
.done h3 { font-size: var(--text-lg); }
.done table { border-collapse: collapse; font-size: var(--text-sm); }
.done td, .done th { padding: calc(var(--spacing)*1) calc(var(--spacing)*4) calc(var(--spacing)*1) 0; text-align: left; }
.done th { color: var(--uw-fg-muted); font-weight: 500; }
input[type="checkbox"] { accent-color: var(--uw-accent); width: 1rem; height: 1rem; margin: 0; }

@container dlg (max-width: 44rem) {
  .lhead { display: none; }
  .lhead, .orow, .ghdr { grid-template-columns: 1.75rem 1fr auto; padding-inline: calc(var(--spacing)*3); }
  .orow { padding-block: calc(var(--spacing)*1); row-gap: 0; }
  .orow .ctx { grid-column: 2 / -1; grid-row: 2; }
  .orow .chg { grid-column: 3; grid-row: 1; }
  .orow .ref { grid-column: 2; grid-row: 1; }
  .orow .vbtn { grid-column: 2 / -1; grid-row: 3; justify-self: start; }
  .ghdr { top: 0; }
  .verse { margin-left: calc(var(--spacing)*3); }
}
</style>
</head>
<body>

<div class="mock-bar" role="toolbar" aria-label="Mockup-Steuerung">
  <strong>Mockup</strong>
  <span>Theme:</span>
  <button class="btn" data-theme-set="system" aria-pressed="true">System</button>
  <button class="btn" data-theme-set="light" aria-pressed="false">Hell</button>
  <button class="btn" data-theme-set="dark" aria-pressed="false">Dunkel</button>
  <span>· Breite:</span>
  <button class="btn" data-width="full" aria-pressed="true">Fenster</button>
  <button class="btn" data-width="phone" aria-pressed="false">375 px</button>
  <span>· Zustand:</span>
  <button class="btn" data-scenario="normal" aria-pressed="true">Normal</button>
  <button class="btn" data-scenario="dirty" aria-pressed="false">Ungespeicherte Änderungen</button>
  <button class="btn" data-scenario="conflict" aria-pressed="false">Konflikt (409)</button>
  <button class="btn" data-scenario="loading" aria-pressed="false">Laden</button>
  <button class="btn" data-scenario="empty" aria-pressed="false">Keine Treffer</button>
  <button class="btn" data-scenario="error" aria-pressed="false">Fehler</button>
  <button class="btn" id="mock-reset">Daten zurücksetzen</button>
</div>

<div class="stage" id="stage">
  <div class="frame" id="frame">
    <header class="app-header">
      <span class="brand">Unshackled Word</span><span class="muted">Bibel</span>
      <span class="spacer"></span><span class="muted">DE</span><span class="avatar" aria-hidden="true">M</span>
    </header>
    <main>
      <div class="ed-head">
        <h1>Lemma-Editor · Offenbarung 1</h1>
        <p class="ed-sum" id="ed-sum"></p>
      </div>
      <div class="filters">
        <button class="btn" id="open-bulk" title="Lemma in vielen Versen ersetzen">Lemma ersetzen …</button>
        <span class="muted" id="active-hint"></span>
        <span class="count">Klick auf eine Zeile wählt sie als Ausgangslemma vor</span>
      </div>
      <div class="gscroll"><div class="grid" role="grid" aria-label="Lemmata Offb 1" id="grid"></div></div>
      <div class="savebar" id="savebar" hidden>
        <div class="msg" id="savemsg"></div>
        <button class="btn btn-primary">Speichern</button>
      </div>
    </main>
  </div>
  <div class="overlay" id="overlay" hidden>
    <div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title"></div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const fmt = n => n.toLocaleString('de-DE');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ------------------------------------------------------------ mock data */
const BOOKS = [ // id, kürzel, name, Kapitel, Anzahl Vorkommen (Jesu+Jesum)

/* ------------------------------------------------------------ step 2: Prüfen */
function selCount() { return S.res.length - S.excluded.size; }
function pageRange() { const a = (S.page - 1) * S.size; return [a, Math.min(S.res.length, a + S.size)]; }
function renderReview(d) {
  const summary = `<div class="sumline"><span>${S.from.map(l => `<span class="chip">${esc(l)}</span>`).join(' ')}</span><span class="arrow">&rarr;</span><span class="chip">${esc(S.to)}</span>
    <span class="muted">${S.pos || 'alle Wortarten'} · ${{ chapter: bookBy(+S.scBook)[2] + ' ' + S.scCh, book: bookBy(+S.scBook)[2], testament: 'Neues Testament', all: 'ganze Bibel' }[S.scope]}</span>
    <span class="grow"></span><button class="btn" data-act="to-search">Suche ändern</button></div>`;
  if (S.status === 'loading') {
    d.innerHTML = head(2) + summary + `<div class="dlg-body flush" aria-busy="true" role="status"><p class="sr-only">Lädt Treffer …</p>${Array.from({ length: 9 }, (_, i) => `<div class="sk-row"><span class="skel" style="width:1rem"></span><span class="skel" style="width:4rem"></span><span class="skel" style="width:${50 + (i * 7) % 30}%"></span></div>`).join('')}</div>
      <div class="dlg-foot"><span class="grow muted">Treffer werden geladen …</span><div class="actions"><button class="btn" data-act="to-search">Abbrechen</button></div></div>`;
    return;
  }
  if (S.status === 'error') {
    d.innerHTML = head(2) + summary + `<div class="dlg-body"><div class="notice" role="alert"><p><b>Die Treffer konnten nicht geladen werden.</b></p><p>Der Server hat nicht geantwortet (Zeitüberschreitung). Es wurde nichts geändert.</p>
      <div class="actions"><button class="btn btn-primary" data-act="retry">Erneut versuchen</button><button class="btn" data-act="to-search">Suche ändern</button></div></div></div><div class="dlg-foot"><span class="grow"></span></div>`;
    focusIn('[data-act="retry"]'); return;
  }
  if (S.status === 'empty') {
    d.innerHTML = head(2) + summary + `<div class="dlg-body flush"><div class="empty-state"><h3>Keine Treffer</h3><p>Im gewählten Bereich hat kein Vorkommen das Lemma ${esc(S.from.join(', '))}${S.pos ? ' mit Wortart ' + S.pos : ''}. Bereich erweitern oder die Schreibweise prüfen (Groß-/Kleinschreibung zählt).</p>
      <button class="btn btn-primary" data-act="to-search">Suche ändern</button></div></div><div class="dlg-foot"><span class="grow"></span></div>`;
    focusIn('.empty-state .btn'); return;
  }
  clampPage();
  const total = S.res.length, pages = Math.max(1, Math.ceil(total / S.size)), [a, b] = pageRange();
  const staleBanner = S.staleBanner ? `<div class="notice" role="alert" style="margin:var(--spacing);margin:calc(var(--spacing)*3) calc(var(--spacing)*4) 0"><p><b>${S.staleBanner.length} Zeilen haben sich inzwischen geändert (409).</b> Ihr Lemma ist nicht mehr ${esc(S.from.join('/'))}. Nichts wurde geschrieben. Die Zeilen sind markiert und abgewählt, der Rest der Auswahl bleibt.</p>
    <div class="actions"><button class="btn" data-act="goto-stale">Zur ersten betroffenen Zeile</button><button class="btn" data-act="dismiss-stale">Hinweis schließen</button></div></div>` : '';
  d.innerHTML = head(2) + summary + staleBanner + `<div class="rtool">
      <span class="pager" role="navigation" aria-label="Seiten">
        <button class="btn" data-act="pg" data-p="1" ${S.page <= 1 ? 'disabled' : ''} aria-label="Erste Seite">&laquo;</button>
        <button class="btn" data-act="pg" data-p="${S.page - 1}" ${S.page <= 1 ? 'disabled' : ''} aria-label="Vorherige Seite">&lsaquo;</button>
        <span class="pg" aria-live="polite">Seite ${fmt(S.page)} von ${fmt(pages)}</span>
        <button class="btn" data-act="pg" data-p="${S.page + 1}" ${S.page >= pages ? 'disabled' : ''} aria-label="Nächste Seite">&rsaquo;</button>
        <button class="btn" data-act="pg" data-p="${pages}" ${S.page >= pages ? 'disabled' : ''} aria-label="Letzte Seite">&raquo;</button></span>
      <label>Zeilen pro Seite <select id="page-size">${[50, 100, 250, 500].map(n => `<option ${n === S.size ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <span class="muted">Zeilen ${fmt(a + 1)}–${fmt(b)} von ${fmt(total)}</span><span class="sep"></span>
      <button class="btn" data-act="sel-page">Seite wählen/abwählen</button>
      <button class="btn" data-act="sel-all">Alle ${fmt(total)} wählen</button>
      <button class="btn" data-act="sel-none">Alle abwählen</button></div>
    <div class="list" id="list" role="listbox" aria-multiselectable="true" aria-label="Treffer, Leertaste wählt, Umschalt+Klick wählt einen Bereich">${listHtml()}</div>
    <div class="dlg-foot"><span class="grow" id="selcount" aria-live="polite"></span><div class="actions">
      <button class="btn" data-act="to-search">Zurück</button><button class="btn btn-primary" id="apply" data-act="apply"></button></div></div>`;
  paintSel();
  const list = $('#list'); list.scrollTop = 0;
  const f = $(`.orow[data-idx="${Math.min(Math.max(S.focusIdx, a), b - 1)}"]`) || $('.orow'); if (f && !document.activeElement.closest?.('.rtool')) f.focus({ preventScroll: true });
}
function listHtml() {
  const [a, b] = pageRange(); let h = '<div class="lhead"><span></span><span>Stelle</span><span>Kontext (±5 Wörter)</span><span>Lemma</span><span></span></div>';
  const gidx = new Map(S.groups.map(g => [g.key, g])); let prev = null;
  for (let i = a; i < b; i++) {
    const o = S.res[i], k = gkey(o);
    if (k !== prev) {
      const g = gidx.get(k), cont = i === a && g.ids[0] !== o.id;
      h += `<div class="ghdr" role="presentation" data-gk="${esc(k)}"><input type="checkbox" data-gcheck="${esc(k)}" aria-label="Gruppe ${esc(g.plain)} ${g.pos} wählen"><span class="gtitle">${esc(g.plain)} · ${g.pos}${cont ? ' (Fortsetzung)' : ''}<small data-gcount="${esc(k)}"></small></span></div>`;
      prev = k;
    }
    const stale = S.stale.has(o.id);
    h += `<div class="orowwrap" data-wrap="${i}"><div class="orow" role="option" tabindex="${i === S.focusIdx || (i === a && (S.focusIdx < a || S.focusIdx >= b)) ? 0 : -1}" data-idx="${i}" data-id="${o.id}" ${stale ? 'data-stale' : ''} aria-selected="true">
      <input type="checkbox" tabindex="-1" aria-label="${ref(o)} wählen"><span class="ref">${ref(o)}</span>
      <span class="ctx"><span class="l">${esc(o.left)} </span><mark>${esc(o.shown)}</mark> ${esc(o.right)}</span>
      <span class="chg"><s>${esc(o.lemma)}</s> &rarr; <b>${esc(S.to)}</b>${stale ? ' <span class="stale">schon geändert</span>' : ''}</span>
      <button class="btn vbtn" data-act="verse" data-id="${o.id}" aria-expanded="false">Vers anzeigen</button></div><div class="verse-slot" data-slot="${o.id}"></div></div>`;
  }
  return h;
}
function paintSel() {
  const [a, b] = pageRange(), list = $('#list'); if (!list) return;
  $$('.orow', list).forEach(r => { const off = S.excluded.has(+r.dataset.id); r.dataset.off = off ? '1' : ''; if (!off) delete r.dataset.off; r.setAttribute('aria-selected', String(!off)); $('input', r).checked = !off; });
  for (const g of S.groups) {
    const cb = $(`[data-gcheck="${CSS.escape(g.key)}"]`, list); if (!cb) continue;
    const n = g.ids.filter(id => !S.excluded.has(id)).length;
    cb.checked = n === g.ids.length; cb.indeterminate = n > 0 && n < g.ids.length;
    $(`[data-gcount="${CSS.escape(g.key)}"]`, list).textContent = `${fmt(g.ids.length)} Treffer in der Bibel · ${fmt(n)} gewählt`;
  }
  const n = selCount();
  $('#selcount').innerHTML = `<b>${fmt(n)}</b> von ${fmt(S.res.length)} ausgewählt <span class="muted">(über alle Seiten)</span>`;
  const ap = $('#apply'); ap.disabled = n === 0 || S.applying; ap.textContent = S.applying ? 'Wird angewendet …' : `Auswahl anwenden (${fmt(n)})`;
}
function setSel(ids, on) { for (const id of ids) on ? S.excluded.delete(id) : S.excluded.add(id); paintSel(); }
function toggleIdx(idx, shift) {
  const o = S.res[idx], on = S.excluded.has(o.id); // Ziel: neuer Zustand "gewählt" wenn bisher abgewählt
  if (shift && S.lastIdx != null) {
    const [a, b] = pageRange(); const lo = Math.max(a, Math.min(idx, S.lastIdx)), hi = Math.min(b - 1, Math.max(idx, S.lastIdx));
    setSel(S.res.slice(lo, hi + 1).map(x => x.id), on);
  } else setSel([o.id], on);
  S.lastIdx = idx; S.focusIdx = idx;
}
$('#dlg').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  const el = e.target.closest('[data-act]');
  if (act) return handleAct(act, el, e);
  const gc = e.target.closest('[data-gcheck]');
  if (gc) { const g = S.groups.find(x => x.key === gc.dataset.gcheck); const all = g.ids.every(id => !S.excluded.has(id)); setSel(g.ids, !all); return; }
  const row = e.target.closest('.orow');
  if (row) { e.preventDefault(); const idx = +row.dataset.idx; row.focus(); toggleIdx(idx, e.shiftKey); }
});
$('#dlg').addEventListener('keydown', e => {
  const row = e.target.closest?.('.orow'); if (!row) return;
  const idx = +row.dataset.idx, [a, b] = pageRange();
  const go = i => { i = Math.max(a, Math.min(b - 1, i)); const t = $(`.orow[data-idx="${i}"]`); if (t) { $$('.orow[tabindex="0"]').forEach(x => x.tabIndex = -1); t.tabIndex = 0; t.focus(); S.focusIdx = i; } };
  if (e.key === ' ' && e.target === row) { e.preventDefault(); toggleIdx(idx, e.shiftKey); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); go(idx + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); go(idx - 1); }
  else if (e.key === 'Home') { e.preventDefault(); go(a); }
  else if (e.key === 'End') { e.preventDefault(); go(b - 1); }
  else if (e.key === 'PageDown') { e.preventDefault(); go(idx + 10); }
  else if (e.key === 'PageUp') { e.preventDefault(); go(idx - 10); }
});

async function handleAct(act, el) {
  switch (act) {
    case 'close': closeDialog(); break;
    case 'rm-from': S.from = S.from.filter(l => l !== el.dataset.l); paintSearch(); focusIn('#from-in'); break;
    case 'add-from': S.from.push(el.dataset.l); S.fromInput = ''; paintSearch(); focusIn('#from-in'); break;
    case 'set-to': S.to = el.dataset.l; $('#to-in').value = S.to; paintSearch(); break;
    case 'search': runSearch(false); break;
    case 'to-search': S.searchToken++; if (S.status === 'loading') S.status = 'idle'; nav(hashOf({ dlg: 'search' }), false); break;
    case 'retry': runSearch(true); break;
    case 'pg': S.page = +el.dataset.p; S.focusIdx = (S.page - 1) * S.size; nav(reviewParams(), false); break;
    case 'sel-page': { const [a, b] = pageRange(); const ids = S.res.slice(a, b).map(o => o.id); setSel(ids, ids.some(id => S.excluded.has(id))); break; }
    case 'sel-all': S.excluded = new Set(); paintSel(); break;
    case 'sel-none': S.excluded = new Set(S.res.map(o => o.id)); paintSel(); break;
    case 'dismiss-stale': S.staleBanner = null; renderDialog(); break;
    case 'goto-stale': { const i = S.res.findIndex(o => S.stale.has(o.id)); S.page = Math.floor(i / S.size) + 1; S.focusIdx = i; nav(reviewParams(), false); break; }
    case 'verse': return toggleVerse(+el.dataset.id, el);
    case 'apply': return apply();
    case 'undo': return undo();
    case 'save-continue': {
      el.disabled = true; el.textContent = 'Speichert …'; await sleep(700);
      S.dirty = 0; S.scenario = 'normal'; syncScenarioButtons(); renderGrid(); S.step = 1; toast('3 Änderungen gespeichert'); renderDialog(); break;
    }
  }
}

/* verse on demand */
async function toggleVerse(id, btn) {
  const slot = $(`[data-slot="${id}"]`), o = ID2OCC.get(id);
  if (S.expanded.has(id)) { S.expanded.delete(id); slot.innerHTML = ''; btn.textContent = 'Vers anzeigen'; btn.setAttribute('aria-expanded', 'false'); return; }
  S.expanded.add(id); btn.setAttribute('aria-expanded', 'true'); btn.textContent = 'Vers ausblenden';
  if (!S.verseCache.has(id)) {
    slot.innerHTML = '<div class="verse" aria-busy="true"><span class="skel" style="width:90%;display:block"></span><span class="skel" style="width:70%;display:block"></span></div>';
    btn.disabled = true; btn.textContent = 'Lädt …';
    await sleep(750);
    btn.disabled = false; btn.textContent = 'Vers ausblenden';
    S.verseCache.set(id, true);
    if (!S.expanded.has(id) || !document.contains(slot)) return;
  }
  const tail = TAIL[id % TAIL.length];
  slot.innerHTML = `<div class="verse"><small>${bookBy(o.book)[2]} ${o.ch},${o.v} · Elberfelder 1871</small>${v1(o)} <mark>${esc(o.shown)}</mark> ${esc(o.right)}, ${tail}.</div>`;
}
const v1 = o => 'Und ' + esc(o.left.charAt(0).toLowerCase() + o.left.slice(1));

/* apply */
async function apply() {
  const ids = S.res.filter(o => !S.excluded.has(o.id)).map(o => o.id);
  S.applying = true; paintSel(); await sleep(900); S.applying = false;
  if (S.scenario === 'conflict' && S.conflictOnce) {
    S.conflictOnce = false;
    const pickIdx = [3, 17, 260, 700].filter(i => i < S.res.length), stale = pickIdx.map(i => S.res[i].id).filter(id => ids.includes(id));
    for (const id of stale) { S.stale.add(id); S.excluded.add(id); }
    S.staleBanner = stale;
    renderDialog(); return;
  }
  S.csCounter++;
  const before = new Map(ids.map(id => [id, ID2OCC.get(id).lemma]));
  for (const id of ids) ID2OCC.get(id).lemma = S.to;
  S.change = { id: S.csCounter, ids, before, to: S.to, from: [...S.from], counts: S.from.map(l => [l, [...before.values()].filter(x => x === l).length]), skipped: 0 };
  S.undone = null; S.step = 3; S.status = 'idle'; S.res = null;
  history.replaceState(null, '', '#dlg=done'); renderGrid(); renderDialog();
}
async function undo() {
  const c = S.change; S.undoing = true; renderDialog(); await sleep(800);
  let skipped = 0, n = 0;
  c.ids.forEach((id, i) => { const o = ID2OCC.get(id); if (S.scenario === 'conflict' && i === 5) { skipped++; return; } o.lemma = c.before.get(id); n++; });
  S.undoing = false; S.undone = { n, skipped, id: c.id + 1 }; S.csCounter++; renderGrid(); renderDialog();
}
function renderDone(d) {
  const c = S.change; if (!c) { closeDialog(); return; }
  const u = S.undone;
  d.innerHTML = head(3) + `<div class="dlg-body"><div class="done" role="status">
    <h3>${u ? `${fmt(u.n)} Vorkommen zurückgesetzt` : `${fmt(c.ids.length)} Vorkommen aktualisiert`}</h3>
    <table><tbody>
      <tr><th>Änderungssatz</th><td>#${c.id}${u ? ` · Rückgängig als #${u.id}` : ''}</td></tr>
      <tr><th>Ersetzt</th><td>${c.counts.map(([l, n]) => `${esc(l)} (${fmt(n)})`).join(', ')} &rarr; <b>${esc(c.to)}</b></td></tr>
      <tr><th>Nicht angewendet</th><td>${fmt(c.skipped)} (abgewählte Zeilen bleiben unverändert)</td></tr>
      ${u && u.skipped ? `<tr><th>Übersprungen</th><td class="err">${u.skipped} Zeile: Lemma wurde inzwischen anderweitig geändert</td></tr>` : ''}
    </tbody></table>
    <p class="help">Geschrieben wurde nur das Lemma. Wortart und Morphologie bleiben unverändert. Jede Zeile hat einen Audit-Eintrag im Änderungssatz #${c.id}.</p></div></div>
    <div class="dlg-foot"><span class="grow"></span><div class="actions">
      <button class="btn" data-act="undo" ${u || S.undoing ? 'disabled' : ''}>${S.undoing ? 'Wird zurückgesetzt …' : u ? 'Bereits rückgängig gemacht' : 'Rückgängig machen'}</button>
      <button class="btn btn-primary" data-act="close">Schließen</button></div></div>`;
  focusIn('.btn-primary');
}

/* ------------------------------------------------------------ mock controls */
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2200); }
function syncScenarioButtons() { $$('[data-scenario]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.scenario === S.scenario))); }
$$('[data-theme-set]').forEach(b => b.addEventListener('click', () => {
  const t = b.dataset.themeSet; if (t === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  $$('[data-theme-set]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
}));
$$('[data-width]').forEach(b => b.addEventListener('click', () => {
  S.phone = b.dataset.width === 'phone'; $('#frame').toggleAttribute('data-phone', S.phone); $('#stage').toggleAttribute('data-phone', S.phone);
  $$('[data-width]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
}));
$$('[data-scenario]').forEach(b => b.addEventListener('click', () => {
  S.scenario = b.dataset.scenario; S.dirty = S.scenario === 'dirty' ? 3 : 0; S.conflictOnce = true; S.errorOnce = true; syncScenarioButtons(); renderGrid();
  if (S.open) { if (S.dirty && S.step !== 3) { S.step = 0; renderDialog(); } else if (S.step === 0) { S.step = 1; renderDialog(); } else if (S.step === 2) runSearch(true); }
}));
$('#mock-reset').addEventListener('click', () => { DATA = buildData(); ID2OCC = BYID(); S.change = null; S.undone = null; if (S.open) closeDialog(); renderGrid(); toast('Mock-Daten zurückgesetzt'); });

renderGrid();
sync(); // Deep-Link / Reload: #dlg=review&page=3&size=100 stellt Dialog, Seite und Seitengröße wieder her
</script>
</body>
</html>
