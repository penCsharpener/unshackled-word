<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datenqualität Mockup</title>
<style>
/* ------------------------------------------------------------------
   Design tokens, copied from src/UnshackledWord.Web/src/styles/index.css
   (+ chart tokens from strongs-stats.html). NEW tokens of this draft are marked "NEW".
   ------------------------------------------------------------------ */
:root {
  color-scheme: light;
  --spacing: 0.25rem;
  --radius-sm: 0.25rem; --radius-md: 0.375rem; --radius-lg: 0.5rem;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem; --text-lg: 1.125rem;
  --text-xl: 1.25rem; --text-2xl: 1.5rem; --text-3xl: 1.875rem; --text-4xl: 2.25rem;
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-scripture: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-original: "SBL BibLit", "Noto Serif Hebrew", "Noto Serif", "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
  --container-page-wide: 120rem;

  --uw-bg: oklch(0.99 0.004 85);
  --uw-surface: oklch(1 0 0);
  --uw-surface-muted: oklch(0.96 0.006 85);
  --uw-fg: oklch(0.22 0.01 60);
  --uw-fg-muted: oklch(0.48 0.01 60);
  --uw-border: oklch(0.88 0.008 80);
  --uw-accent: oklch(0.42 0.1 30);
  --uw-accent-fg: oklch(0.99 0.004 85);
  --uw-focus: oklch(0.6 0.15 250);
  --uw-mark-same: oklch(0.88 0.08 240);
  --uw-chart-1: #2a78d6; --uw-chart-2: #eb6834; --uw-chart-3: #1baf7a; --uw-chart-4: #eda100;
  --uw-chart-5: #e87ba4; --uw-chart-6: #008300; --uw-chart-7: #6250d6; --uw-chart-8: #e34948;
  --uw-chart-empty: oklch(0.9 0.006 80);
  /* NEW: sequential heat ramp (blue, one hue), 0 = no gap ... 5 = >= 20 % gap */
  --uw-heat-0: #f4f2ee; --uw-heat-1: #cde2fb; --uw-heat-2: #86b6ef; --uw-heat-3: #3987e5; --uw-heat-4: #1c5cab; --uw-heat-5: #0d366b;
  /* NEW: status, always with icon + label */
  --uw-sev-error: #d03b3b; --uw-sev-warning: #fab219; --uw-sev-info: #2a78d6; --uw-sev-ok: #0ca30c;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --uw-bg: oklch(0.18 0.008 60); --uw-surface: oklch(0.22 0.01 60); --uw-surface-muted: oklch(0.27 0.012 60);
  --uw-fg: oklch(0.94 0.005 85); --uw-fg-muted: oklch(0.7 0.01 70); --uw-border: oklch(0.34 0.012 60);
  --uw-accent: oklch(0.78 0.1 50); --uw-accent-fg: oklch(0.2 0.01 60); --uw-focus: oklch(0.72 0.14 250);
  --uw-mark-same: oklch(0.42 0.09 240);
  --uw-chart-1: #3987e5; --uw-chart-2: #d95926; --uw-chart-3: #199e70; --uw-chart-4: #c98500;
  --uw-chart-5: #d55181; --uw-chart-6: #008300; --uw-chart-7: #9085e9; --uw-chart-8: #e66767;
  --uw-chart-empty: oklch(0.3 0.01 60);
  --uw-heat-0: #2b2a27; --uw-heat-1: #184f95; --uw-heat-2: #256abf; --uw-heat-3: #3987e5; --uw-heat-4: #6da7ec; --uw-heat-5: #b7d3f6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --uw-bg: oklch(0.18 0.008 60); --uw-surface: oklch(0.22 0.01 60); --uw-surface-muted: oklch(0.27 0.012 60);
    --uw-fg: oklch(0.94 0.005 85); --uw-fg-muted: oklch(0.7 0.01 70); --uw-border: oklch(0.34 0.012 60);
    --uw-accent: oklch(0.78 0.1 50); --uw-accent-fg: oklch(0.2 0.01 60); --uw-focus: oklch(0.72 0.14 250);
    --uw-mark-same: oklch(0.42 0.09 240);
    --uw-chart-1: #3987e5; --uw-chart-2: #d95926; --uw-chart-3: #199e70; --uw-chart-4: #c98500;
    --uw-chart-5: #d55181; --uw-chart-6: #008300; --uw-chart-7: #9085e9; --uw-chart-8: #e66767;
    --uw-chart-empty: oklch(0.3 0.01 60);
    --uw-heat-0: #2b2a27; --uw-heat-1: #184f95; --uw-heat-2: #256abf; --uw-heat-3: #3987e5; --uw-heat-4: #6da7ec; --uw-heat-5: #b7d3f6;
  }
}
[data-section="law"]{--c:var(--uw-chart-1)} [data-section="history"]{--c:var(--uw-chart-2)}
[data-section="wisdom"]{--c:var(--uw-chart-3)} [data-section="prophets"]{--c:var(--uw-chart-4)}
[data-section="gospels"]{--c:var(--uw-chart-5)} [data-section="paul"]{--c:var(--uw-chart-6)}
[data-section="general"]{--c:var(--uw-chart-7)} [data-section="revelation"]{--c:var(--uw-chart-8)}
[data-sev="error"]{--s:var(--uw-sev-error)} [data-sev="warning"]{--s:var(--uw-sev-warning)}
[data-sev="info"]{--s:var(--uw-sev-info)} [data-sev="ok"]{--s:var(--uw-sev-ok)}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--uw-bg); color: var(--uw-fg); font-family: var(--font-sans); line-height: 1.5; }
:focus-visible { outline: 2px solid var(--uw-focus); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.muted { color: var(--uw-fg-muted); }
.orig { font-family: var(--font-original); color: var(--uw-accent); }
.num { font-variant-numeric: tabular-nums; }

/* ---- mockup-only toolbar ---- */
.mock-bar { position: sticky; top: 0; z-index: 9; display: flex; flex-wrap: wrap; gap: calc(var(--spacing)*2); align-items: center;
  padding: calc(var(--spacing)*2) calc(var(--spacing)*4); background: var(--uw-surface-muted); border-bottom: 1px solid var(--uw-border); font-size: var(--text-sm); }
.mock-bar strong { margin-right: calc(var(--spacing)*1); }
.mock-toast { margin-left: auto; color: var(--uw-fg-muted); font-size: var(--text-xs); max-width: 40rem; overflow-wrap: anywhere; }

/* ---- Button (variants of the existing component) ---- */
.btn { font: inherit; font-size: var(--text-sm); cursor: pointer; border: 1px solid var(--uw-border); background: var(--uw-surface); color: var(--uw-fg);
  border-radius: var(--radius-md); padding: calc(var(--spacing)*1) calc(var(--spacing)*3); }
.btn:hover { background: var(--uw-surface-muted); }
.btn[aria-pressed="true"] { background: var(--uw-accent); color: var(--uw-accent-fg); border-color: var(--uw-accent); }
.btn-primary { background: var(--uw-accent); color: var(--uw-accent-fg); border-color: var(--uw-accent); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--uw-accent); padding-inline: calc(var(--spacing)*1); }
.btn-ghost:hover { text-decoration: underline; background: transparent; }
.btn-inline { border: 0; background: none; padding: 0; color: var(--uw-accent); text-decoration: underline; font: inherit; cursor: pointer; text-align: start; }
.btn-sm { font-size: var(--text-xs); padding: 0 calc(var(--spacing)*2); }
.seg-group { display: inline-flex; gap: calc(var(--spacing)*1); flex-wrap: wrap; }
.field { display: grid; gap: calc(var(--spacing)*1); font-size: var(--text-sm); }
.input, .select { font: inherit; font-size: var(--text-sm); color: var(--uw-fg); background: var(--uw-surface); border: 1px solid var(--uw-border);
  border-radius: var(--radius-md); padding: calc(var(--spacing)*1.5) calc(var(--spacing)*2); min-width: 0; }

/* ---- page frame ---- */
.frame { margin-inline: auto; width: 100%; max-width: var(--container-page-wide); container-type: inline-size; }
.frame[data-phone] { max-width: 375px; border-inline: 1px dashed var(--uw-border); }
main { padding: calc(var(--spacing)*8) calc(var(--spacing)*4); display: grid; gap: calc(var(--spacing)*10); }
@container (width >= 48rem) { main { padding-inline: calc(var(--spacing)*8); } }
section > h2 { font-family: var(--font-scripture); font-size: var(--text-xl); font-weight: 600; }
section > h2 + p { font-size: var(--text-sm); color: var(--uw-fg-muted); }
@container (width >= 48rem) { section > h2 { font-size: var(--text-2xl); } }
.card { border: 1px solid var(--uw-border); border-radius: var(--radius-lg); background: var(--uw-surface); padding: calc(var(--spacing)*4); display: grid; gap: calc(var(--spacing)*3); align-content: start; min-width: 0; }
.card h3 { font-family: var(--font-scripture); font-size: var(--text-lg); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--spacing)*2); }
.spread { justify-content: space-between; }

/* ---- header ---- */
.page-head h1 { font-family: var(--font-scripture); font-size: var(--text-2xl); font-weight: 600; }
@container (width >= 48rem) { .page-head h1 { font-size: var(--text-3xl); } }
.stat-line { display: flex; flex-wrap: wrap; gap: calc(var(--spacing)*1) calc(var(--spacing)*4); font-size: var(--text-sm); color: var(--uw-fg-muted); margin-top: calc(var(--spacing)*1); }
.stat-line b { color: var(--uw-fg); }
.facets { margin-top: calc(var(--spacing)*4); }
.banner { margin-top: calc(var(--spacing)*3); font-size: var(--text-sm); border-left: 3px solid var(--uw-sev-info); background: var(--uw-surface-muted); padding: calc(var(--spacing)*2) calc(var(--spacing)*3); border-radius: var(--radius-sm); }

/* ---- StatTile (NEW) ---- */
.tile-group { display: grid; gap: calc(var(--spacing)*2); margin-top: calc(var(--spacing)*4); }
.tile-group h3 { font-size: var(--text-sm); font-weight: 600; color: var(--uw-fg-muted); text-transform: uppercase; letter-spacing: .04em; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: calc(var(--spacing)*2); }
@container (width >= 40rem) { .tiles { grid-template-columns: repeat(3, minmax(0,1fr)); } }
@container (width >= 72rem) { .tiles { grid-template-columns: repeat(6, minmax(0,1fr)); } }
.tile { font: inherit; text-align: start; cursor: pointer; color: inherit; background: var(--uw-surface); border: 1px solid var(--uw-border); border-left: 4px solid var(--s);
  border-radius: var(--radius-lg); padding: calc(var(--spacing)*3); display: grid; gap: calc(var(--spacing)*1); align-content: start; min-width: 0; }
.tile:hover { background: var(--uw-surface-muted); }
.tile[aria-current="true"] { outline: 2px solid var(--uw-accent); outline-offset: -1px; }
.tile .t-head { display: flex; justify-content: space-between; gap: calc(var(--spacing)*1); font-size: var(--text-xs); color: var(--uw-fg-muted); }
.tile .t-title { font-size: var(--text-sm); font-weight: 600; line-height: 1.3; }
.tile .t-val { font-size: var(--text-2xl); font-weight: 600; line-height: 1.1; }
.tile .t-sub { font-size: var(--text-xs); color: var(--uw-fg-muted); display: none; }
@container (width >= 40rem) { .tile .t-sub { display: block; } }
@container (width >= 150rem) { .tile .t-val { font-size: var(--text-3xl); } }
.sev { display: inline-flex; align-items: center; gap: calc(var(--spacing)*1); font-size: var(--text-xs); white-space: nowrap; color: var(--uw-fg); }
.sev::before { content: ""; width: .7em; height: .7em; background: var(--s); flex: none; }
.sev[data-sev="error"]::before { border-radius: 1px; rotate: 45deg; }           /* diamond = error */
.sev[data-sev="warning"]::before { clip-path: polygon(50% 0, 100% 100%, 0 100%); } /* triangle = check */
.sev[data-sev="info"]::before, .sev[data-sev="ok"]::before { border-radius: 50%; } /* dot = note / clean */
.skel { display: inline-block; height: .8em; border-radius: var(--radius-sm); background: var(--uw-border); width: 60%; }

/* ---- unmapped panels ---- */
.panels { display: grid; gap: calc(var(--spacing)*4); margin-top: calc(var(--spacing)*3); }
@container (width >= 72rem) { .panels { grid-template-columns: repeat(3, minmax(0,1fr)); } }
.fn-toggle { margin-top: calc(var(--spacing)*2); font-size: var(--text-sm); }
.big { font-size: var(--text-3xl); font-weight: 600; line-height: 1; }

/* DonutChart (existing) */
.donut-body { display: grid; gap: calc(var(--spacing)*3); align-items: center; }
@container (width >= 40rem) { .donut-body { grid-template-columns: calc(var(--spacing)*32) minmax(0,1fr); } }
@container (width >= 150rem) { .donut-body { grid-template-columns: calc(var(--spacing)*44) minmax(0,1fr); } }
.ring { position: relative; aspect-ratio: 1; width: calc(var(--spacing)*32); }
@container (width >= 150rem) { .ring { width: calc(var(--spacing)*44); } }
.ring svg { width: 100%; height: 100%; rotate: -90deg; display: block; }
.ring circle { fill: none; stroke-width: 7; }
.ring .track { stroke: var(--uw-chart-empty); }
.ring .seg { stroke: var(--c); cursor: pointer; }
.ring .seg[data-legit] { opacity: .45; }
.donut[data-filtered] .seg:not([data-active]) { opacity: .2; }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.ring .center b { font-size: var(--text-2xl); line-height: 1; }
.ring .center span { font-size: var(--text-xs); color: var(--uw-fg-muted); }
.slices { display: grid; gap: calc(var(--spacing)*1); font-size: var(--text-sm); }
.slices li { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: calc(var(--spacing)*2); align-items: center; }
.slices li[data-legit] .lbl { color: var(--uw-fg-muted); }
.swatch { width: calc(var(--spacing)*3); height: calc(var(--spacing)*3); border-radius: var(--radius-sm); background: var(--c); }
.slot-1{--c:var(--uw-chart-1)} .slot-2{--c:var(--uw-chart-2)} .slot-3{--c:var(--uw-chart-3)} .slot-4{--c:var(--uw-chart-4)}
.slot-5{--c:var(--uw-chart-5)} .slot-6{--c:var(--uw-chart-6)} .slot-7{--c:var(--uw-chart-7)} .slot-8{--c:var(--uw-chart-8)}

/* RankedBarList (NEW) + BookBarChart list view (existing) share the row grid */
.ranked { display: grid; gap: calc(var(--spacing)*1.5); }
.ranked > li { display: grid; gap: calc(var(--spacing)*1); }
.rk { display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr) auto; gap: calc(var(--spacing)*2); align-items: center; font-size: var(--text-sm); }
.rk .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk .track { display: block; height: calc(var(--spacing)*3); background: var(--uw-chart-empty); border-radius: 0 4px 4px 0; }
.rk .bar { display: block; height: 100%; width: calc(var(--v) * 100%); min-width: 2px; background: var(--c, var(--uw-chart-1)); border-radius: 0 4px 4px 0; }
.rk .val { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rk .val small { color: var(--uw-fg-muted); margin-left: calc(var(--spacing)*1); }
.ranked li[data-selected] .rk { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: calc(var(--spacing)*1); }
.chip { font-size: var(--text-xs); border: 1px solid var(--uw-border); border-radius: var(--radius-sm); padding: 0 calc(var(--spacing)*1.5); display: inline-flex; gap: calc(var(--spacing)*1); align-items: center; }
.chip.sev::before { width: .55em; height: .55em; }
.expand { border-left: 2px solid var(--uw-border); margin-left: calc(var(--spacing)*2); padding-left: calc(var(--spacing)*3); display: grid; gap: calc(var(--spacing)*2); }

/* ---- CoverageHeatmap (NEW) ---- */
.heat-tools { display: flex; flex-wrap: wrap; gap: calc(var(--spacing)*3); align-items: center; justify-content: space-between; margin-top: calc(var(--spacing)*3); }
.heat-legend { display: flex; align-items: center; gap: calc(var(--spacing)*1); font-size: var(--text-xs); color: var(--uw-fg-muted); flex-wrap: wrap; }
.heat-legend i { background: var(--h); display: inline-block; width: calc(var(--spacing)*5); height: calc(var(--spacing)*3); border-radius: 2px; }
.heat { display: grid; gap: 2px; margin-top: calc(var(--spacing)*3); }
.heat-row { display: grid; grid-template-columns: minmax(0,1fr); gap: 2px; align-items: start; }
@container (width >= 40rem) { .heat-row { grid-template-columns: calc(var(--spacing)*12) minmax(0,1fr); } }
.heat-row .bk { font-size: var(--text-xs); color: var(--uw-fg-muted); line-height: calc(var(--spacing)*3); }
.heat-cells { display: flex; flex-wrap: wrap; gap: 2px; }
.cell { width: calc(var(--spacing)*3); height: calc(var(--spacing)*3); padding: 0; border: 0; border-radius: 2px; cursor: pointer; background: var(--h); }
@container (width >= 150rem) { .cell { width: calc(var(--spacing)*4); height: calc(var(--spacing)*4); } .heat-row .bk { line-height: calc(var(--spacing)*4); } }
.cell[aria-pressed="true"] { outline: 2px solid var(--uw-fg); outline-offset: 1px; }
.cell:hover { outline: 1px solid var(--uw-fg); }
.cell[data-off] { outline: 2px dashed var(--uw-sev-error); outline-offset: -2px; }
.h0{--h:var(--uw-heat-0)} .h1{--h:var(--uw-heat-1)} .h2{--h:var(--uw-heat-2)} .h3{--h:var(--uw-heat-3)} .h4{--h:var(--uw-heat-4)} .h5{--h:var(--uw-heat-5)}
.heat-sep { font-size: var(--text-xs); font-weight: 600; color: var(--uw-fg-muted); margin-top: calc(var(--spacing)*2); text-transform: uppercase; letter-spacing: .04em; }
.heat-info { font-size: var(--text-sm); min-height: 1.5em; }

/* ---- Explorer ---- */
.explorer { display: grid; gap: calc(var(--spacing)*4); margin-top: calc(var(--spacing)*3); }
.search-row { display: grid; gap: calc(var(--spacing)*2); }
@container (width >= 48rem) { .search-row { grid-template-columns: auto minmax(0,1fr) calc(var(--spacing)*48); align-items: end; } }
.trail ol { display: flex; flex-wrap: wrap; gap: calc(var(--spacing)*1); align-items: center; font-size: var(--text-sm); }
.trail li + li::before { content: "›"; color: var(--uw-fg-muted); margin-right: calc(var(--spacing)*1); }
.trail [aria-current] { font-weight: 600; text-decoration: none; color: var(--uw-fg); cursor: default; }
.url-line { font-size: var(--text-xs); color: var(--uw-fg-muted); overflow-wrap: anywhere; font-family: ui-monospace, monospace; }
.cands { display: grid; gap: calc(var(--spacing)*1); }
.cands .btn { display: flex; width: 100%; gap: calc(var(--spacing)*2); align-items: baseline; flex-wrap: wrap; text-align: start; }
.result { display: grid; gap: calc(var(--spacing)*4); }
@container (width >= 72rem) { .result { grid-template-columns: minmax(0,3fr) minmax(0,2fr); align-items: start; } }
.res-head h3 { font-family: var(--font-scripture); font-size: var(--text-xl); font-weight: 600; }
.res-head h3 .orig { font-weight: 400; }
.res-head .tr { font-style: italic; font-weight: 400; }

/* ---- FindingsTable (NEW) ---- */
.f-tools { display: flex; flex-wrap: wrap; gap: calc(var(--spacing)*2); align-items: center; justify-content: space-between; margin-top: calc(var(--spacing)*3); }
table.findings { width: 100%; border-collapse: collapse; font-size: var(--text-sm); display: none; margin-top: calc(var(--spacing)*3); }
.findings th { text-align: start; font-size: var(--text-xs); color: var(--uw-fg-muted); font-weight: 600; border-bottom: 1px solid var(--uw-border); padding: calc(var(--spacing)*2); }
.findings td { border-bottom: 1px solid var(--uw-border); padding: calc(var(--spacing)*2); vertical-align: top; }
.findings tr:hover td { background: var(--uw-surface-muted); }
.findings .jumps { display: flex; flex-wrap: wrap; gap: calc(var(--spacing)*1); }
.ctx { font-family: var(--font-scripture); color: var(--uw-fg-muted); }
.ctx mark { background: var(--uw-mark-same); color: var(--uw-fg); border-radius: 2px; padding-inline: 2px; }
.fcards { display: grid; gap: calc(var(--spacing)*2); margin-top: calc(var(--spacing)*3); }
.fcards .card { gap: calc(var(--spacing)*1.5); padding: calc(var(--spacing)*3); font-size: var(--text-sm); }
@container (width >= 40rem) { table.findings { display: table; } .fcards { display: none; } }
@container (width < 72rem) { .findings .col-gloss { display: none; } }
.pager { display: flex; flex-wrap: wrap; gap: calc(var(--spacing)*2); align-items: center; justify-content: space-between; margin-top: calc(var(--spacing)*3); font-size: var(--text-sm); }
.badge { font-size: var(--text-xs); border-radius: var(--radius-sm); padding: 0 calc(var(--spacing)*1.5); background: var(--uw-surface-muted); color: var(--uw-fg-muted); border: 1px dashed var(--uw-border); }

/* EmptyState / error (existing EmptyState, FormError) */
.empty { border: 1px dashed var(--uw-border); border-radius: var(--radius-lg); padding: calc(var(--spacing)*4); font-size: var(--text-sm); color: var(--uw-fg-muted); display: grid; gap: calc(var(--spacing)*2); justify-items: start; }
.empty b { color: var(--uw-fg); }
.err { border-left: 3px solid var(--uw-sev-error); padding: calc(var(--spacing)*2) calc(var(--spacing)*3); font-size: var(--text-sm); display: flex; gap: calc(var(--spacing)*3); align-items: center; flex-wrap: wrap; background: var(--uw-surface-muted); border-radius: var(--radius-sm); }
</style>
</head>
<body>
<div class="mock-bar" role="toolbar" aria-label="Mockup-Steuerung">
  <strong>Mockup</strong>
  <span class="seg-group" id="mTheme">

  const total = slices.reduce((a, s) => a + s.value, 0); let off = 0; const sel = S.donutSel[id];
  const segs = slices.map((s, i) => { const len = s.value / total * 100; const gap = Math.min(.6, len / 3);
    const el = `<circle class="seg slot-${i + 1}" cx="20" cy="20" r="15.9" pathLength="100" stroke-dasharray="${Math.max(len - gap, .1)} ${100 - Math.max(len - gap, .1)}" stroke-dashoffset="${-off}" ${s.legit ? "data-legit" : ""} ${sel === s.key ? "data-active" : ""} data-donut="${id}" data-key="${s.key}"><title>${esc(s.label)}: ${fmt(s.value)}</title></circle>`;
    off += len; return el; }).join("");
  const active = slices.find(s => s.key === sel);
  return `<div class="donut" ${sel ? "data-filtered" : ""}><div class="donut-body">
    <div class="ring"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="track" cx="20" cy="20" r="15.9"/>${segs}</svg>
      <div class="center"><b class="num">${fmt(active ? active.value : center)}</b><span>${esc(active ? active.label : centerLabel)}</span></div></div>
    <ul class="slices">${slices.map((s, i) => `<li ${s.legit ? "data-legit" : ""}><span class="swatch slot-${i + 1}"></span>
      <button class="btn-inline lbl" data-donut="${id}" data-key="${s.key}" aria-pressed="${sel === s.key}">${esc(s.label)}${s.legit ? ' <span class="muted">· meist korrekt</span>' : ""}</button>
      <span class="num muted">${fmt(s.value)} · ${pct(s.value, total)}</span></li>`).join("")}</ul></div></div>`;
}
function ranked(items, opts = {}) {
  const max = Math.max(...items.map(i => i.value), 1);
  return `<ol class="ranked">${items.map(it => `<li ${opts.selected === it.key ? "data-selected" : ""}>
    <div class="rk"><span class="lbl">${it.labelHtml}</span><span class="track" aria-hidden="true"><span class="bar" style="--v:${it.value / max}"></span></span>
    <span class="val">${fmt(it.value)}${it.share != null ? `<small>${pct(it.value, it.share)}</small>` : ""}</span></div>
    ${it.flags?.length ? `<div class="chips">${it.flags.map(f => `<span class="chip sev" data-sev="${FLAG_LBL[f][1]}">${FLAG_LBL[f][0]}</span>`).join("")}</div>` : ""}
    ${it.after ?? ""}</li>`).join("")}</ol>`;
}
function bookList(counts) {
  const max = Math.max(...counts.map(c => c[1]), 1);
  return `<ol class="ranked">${counts.map(([id, v]) => `<li><div class="rk" data-section="${section(id)}"><button class="btn-inline lbl" data-book="${id}">${bookAbbr(id)}</button>
    <span class="track" aria-hidden="true"><span class="bar" style="--v:${v / max}"></span></span><span class="val">${fmt(v)}</span></div></li>`).join("")}</ol>`;
}

function jumpButtons(f) {

  out.push(`<a class="btn btn-sm" href="#" data-jump="/edit/lemmas/${b}/${c}?word=${f.elbWordId}">Lemma<span class="sr-only"> (neuer Tab)</span></a>`);

  else if (f.lemma || f.german) out.push(`<button class="btn btn-sm btn-ghost" data-filter="d:${(f.lemma ?? f.german).toLowerCase()}${f.pos ? "~" + f.pos : ""}">Filtern</button>`);
  return out.join("");
}

    body = `<table class="findings"><thead><tr><th scope="col">Stelle</th><th scope="col">Deutsch</th><th scope="col">Grundtext</th><th scope="col" class="col-gloss">Kontext</th><th scope="col">Grund</th><th scope="col"><span class="sr-only">Schwere</span></th><th scope="col">Öffnen</th></tr></thead>
      <tbody>${rows.map(f => `<tr><td>${ref(f)}</td><td>${de(f)}</td><td>${orig(f)}</td><td class="col-gloss ctx">${esc(f.ctx).replace(/\{(.+?)\}/, "<mark>$1</mark>")}</td><td>${esc(f.detail)}</td><td>${sev(f)}</td><td><span class="jumps">${jumpButtons(f)}</span></td></tr>`).join("")}</tbody></table>
      <ul class="fcards">${rows.map(f => `<li class="card"><div class="row spread">${ref(f)}${sev(f)}</div><div>${de(f)} → ${orig(f)}</div><div class="ctx">${esc(f.ctx).replace(/\{(.+?)\}/, "<mark>$1</mark>")}</div><div class="muted">${esc(f.detail)}</div><div class="row">${jumpButtons(f)}</div></li>`).join("")}</ul>
      <div class="pager"><span class="muted">1–12 von ${fmt(c.count)}</span><span class="row"><label class="row"><span>Pro Seite</span><select class="select"><option>50</option><option>100</option><option>250</option></select></label>
        <button class="btn btn-sm" disabled>Zurück</button><span>Seite 1</span><button class="btn btn-sm">Weiter</button></span></div>`;
  }
  const facets = [S.facet && `Klasse: ${S.facet}`, S.heatSel && `Kapitel: ${bookAbbr(+S.heatSel.split(":")[0])} ${S.heatSel.split(":")[1]}`, S.book && `Buch: ${bookAbbr(+S.book)}`, S.t && (S.t === "ot" ? "AT" : "NT")].filter(Boolean);
  return `<section aria-labelledby="h-f"><h2 id="h-f">Befunde · ${c.code} ${c.title}</h2>
    <div class="f-tools"><span class="chips">${facets.length ? facets.map(f => `<span class="chip">${f}</span>`).join("") + `<button class="btn btn-ghost btn-sm" data-clearf>Facetten entfernen</button>` : '<span class="muted">Keine Facetten</span>'}</span>
      <label class="row"><input type="checkbox" checked> <span>nur Inhaltswörter</span></label></div>${body}</section>`;
}
function render() {
  const keepFocus = document.activeElement?.id;
  if (S.mode === "never") {
    $("#main").innerHTML = renderHeader().replace(/<div class="banner">[\s\S]*?<\/div>/, "") + `<div class="empty"><b>Noch nicht berechnet.</b>Die Prüfdaten werden einmalig berechnet (ca. 20 s) und danach nach jeder Massenänderung automatisch erneuert.<button class="btn btn-primary" data-refresh>Jetzt berechnen</button></div>`;
  } else $("#main").innerHTML = renderHeader() + renderTiles() + renderUnmapped() + renderHeat() + renderExplorer() + renderFindings();
  if (keepFocus) { const el = document.getElementById(keepFocus); if (el) { el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); } }
}

/* ===================== interactions ===================== */
function setFilter(token) {
  const side = token[0], v = token.slice(2);
  S.x = side; S.q = v; S.expanded = null; S.text = side === "o" ? v : germanDetail(v).lemma;
  if (side === "d") S.pos = v.split("~")[1] ?? "";
  if (S.trail[S.trail.length - 1] !== token) S.trail = [...S.trail, token].slice(-8);
  render(); $("#h-ex").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  $("#h-ex").setAttribute("tabindex", "-1"); $("#h-ex").focus({ preventScroll: true });
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-theme-set],[data-state],#mPhone,[data-check],[data-t],[data-reset],[data-donut],[data-uview],[data-book],[data-hm],[data-cell],[data-x],[data-filter],[data-crumb],[data-cleartrail],[data-expand],[data-jump],[data-refresh],[data-clearf],[data-retry]");
  if (!t) return; const d = t.dataset;
  if (d.themeSet) { document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", b === t)); d.themeSet === "system" ? document.documentElement.removeAttribute("data-theme") : document.documentElement.setAttribute("data-theme", d.themeSet); return; }
  if (d.state) { document.querySelectorAll("[data-state]").forEach(b => b.setAttribute("aria-pressed", b === t)); S.mode = d.state; return render(); }
  if (t.id === "mPhone") { const on = t.getAttribute("aria-pressed") !== "true"; t.setAttribute("aria-pressed", on); on ? $("#frame").setAttribute("data-phone", "") : $("#frame").removeAttribute("data-phone"); return; }
  if (d.jump) { ev.preventDefault(); return toast("Neuer Tab: " + d.jump); }
  if (d.check) { S.check = d.check; S.facet = ""; render(); return $("#h-f").scrollIntoView({ block: "start" }); }
  if (d.t !== undefined) { S.t = d.t; S.book = ""; return render(); }
  if ("reset" in d) { S.t = ""; S.book = ""; return render(); }
  if (d.donut) { S.donutSel[d.donut] = S.donutSel[d.donut] === d.key ? null : d.key;
    if (UNMAPPED[d.donut]) { S.check = UNMAPPED[d.donut].code; S.facet = S.donutSel[d.donut] ?? ""; } return render(); }
  if (d.uview) { S.unmappedView[d.uview] = S.unmappedView[d.uview] === "books" ? "top" : "books"; return render(); }
  if (d.book) { S.book = d.book; return render(); }
  if (d.hm) { S.heatMetric = d.hm; return render(); }
  if (d.cell) { S.heatSel = S.heatSel === d.cell ? null : d.cell; S.check = S.heatMetric === "german" ? "U1" : (+d.cell.split(":")[0] > 39 ? "U2" : "U3"); render(); return document.querySelector(`[data-cell="${d.cell}"]`)?.focus(); }
  if (d.x) { if (S.x !== d.x) { S.x = d.x; S.q = ""; S.text = ""; S.pos = ""; } render(); return $("#q").focus(); }
  if (d.filter) return setFilter(d.filter);
  if (d.crumb) { const i = +d.crumb; const tok = S.trail[i]; S.trail = S.trail.slice(0, i); return setFilter(tok); }
  if ("cleartrail" in d) { S.trail = S.q ? [S.x + ":" + S.q] : []; return render(); }
  if (d.expand) { S.expanded = S.expanded === d.expand ? null : d.expand; return render(); }
  if ("refresh" in d) { S.refreshing = true; if (S.mode === "never") S.mode = "ok"; render(); setTimeout(() => { S.refreshing = false; render(); toast("Neu berechnet (Mock)."); }, 1500); return; }
  if ("clearf" in d) { S.facet = ""; S.heatSel = null; S.book = ""; S.t = ""; S.donutSel = {}; return render(); }
  if ("retry" in d) { document.querySelectorAll("[data-state]").forEach(b => b.setAttribute("aria-pressed", b.dataset.state === "ok")); S.mode = "ok"; return render(); }
});
let deb; document.addEventListener("input", ev => {
  if (ev.target.id === "q") { S.text = ev.target.value; clearTimeout(deb); deb = setTimeout(() => {
      S.q = ""; const ns = S.x === "o" ? searchOriginal(S.text) : []; if (S.x === "o" && ns.length === 1 && ns[0].by === "strongs") return setFilter("o:" + ns[0].s);
      $("#exResult").innerHTML = renderExplorerResult(); }, 250); }
});
document.addEventListener("change", ev => {
  if (ev.target.id === "bookSel") { S.book = ev.target.value; render(); }
  if (ev.target.id === "posSel") { S.pos = ev.target.value; if (S.q) { const l = S.q.split("~")[0]; S.q = ""; S.text = germanDetail(l + (S.pos ? "~" + S.pos : "")).lemma || l; } $("#exResult").innerHTML = renderExplorerResult(); }
  if (ev.target.id === "withFn") { S.withFunction = ev.target.checked; render(); }
});
document.addEventListener("keydown", ev => {
  if (ev.target.id === "q" && ev.key === "Enter") { clearTimeout(deb); S.q = "";
    const first = S.x === "o" ? searchOriginal(S.text)[0] : searchGerman(S.text, S.pos)[0];
    if (first) setFilter(S.x === "o" ? "o:" + first.s : "d:" + first.key); return; }
  const cell = ev.target.closest?.(".cell"); if (!cell) return;
  const r = +cell.dataset.row, c = +cell.dataset.col; let next = null;
  if (ev.key === "ArrowRight") next = [r, c + 1]; if (ev.key === "ArrowLeft") next = [r, c - 1];
  if (ev.key === "ArrowDown") next = [r + 1, c]; if (ev.key === "ArrowUp") next = [r - 1, c];
  if (!next) return; ev.preventDefault();
  let el = document.querySelector(`.cell[data-row="${next[0]}"][data-col="${next[1]}"]`);
  if (!el && (ev.key === "ArrowDown" || ev.key === "ArrowUp")) { const row = document.querySelectorAll(`.cell[data-row="${next[0]}"]`); el = row[row.length - 1]; }
  if (el) { cell.tabIndex = -1; el.tabIndex = 0; el.focus(); }
});
render();
</script>
</body>
</html>
